<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b2350">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Betri Hundar">
<title>Betri Hundar</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root { --ink:#2a1f3d; --bg:#2b2350; --panel:#3d3275; --yellow:#ffd23f; --pink:#ff7eb9; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: #fff;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; touch-action: none; overscroll-behavior: none;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
button { font-family: inherit; touch-action: manipulation; cursor: pointer; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
#topbar { flex: none; height: 54px; display: flex; align-items: center; gap: 6px; padding: 0 8px; z-index: 30;
  background: linear-gradient(#5d4dbd, #3d3188 58%, #2f2665); box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 3px 0 rgba(0,0,0,.25), 0 6px 14px rgba(20,8,50,.3); }
.ib { flex: none; width: 46px; height: 46px; border: 0; border-radius: 14px; background: linear-gradient(#7767d2, #574aa6 55%, #4a3d98); color: #fff;
  display: grid; place-items: center; box-shadow: inset 0 1.5px 0 rgba(255,255,255,.35), inset 0 -2px 0 rgba(0,0,0,.12), 0 4px 0 #231c4c, 0 7px 10px rgba(15,6,40,.3); padding: 0; }
.ib:active { transform: translateY(3px); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.3), 0 1px 0 #231c4c; }
/* glossy cap: a soft white band over the top half, painted above the background but below the content */
.ib, .btn, .daily, #ctrls button, #coins, .tile, .card { position: relative; isolation: isolate; }
.ib::before, .btn::before, .daily::before, #ctrls button::before, #coins::before, .tile::before, .card::before {
  content: ''; position: absolute; left: 6%; right: 6%; top: 2px; height: 46%; border-radius: 12px 12px 40% 40% / 12px 12px 60% 60%;
  background: linear-gradient(rgba(255,255,255,.5), rgba(255,255,255,.06)); z-index: -1; pointer-events: none; }
.tile::before, .card::before { height: 34%; opacity: .55; }
.tile.locked::before, .card.lock::before { opacity: .25; }
#coins::before { opacity: .45; border-radius: 20px 20px 50% 50%; }
.ib svg { width: 26px; height: 26px; }
.ib.hide { visibility: hidden; }
.ib.gone { display: none; }
#title { flex: 1; min-width: 0; font-weight: 900; font-size: 18px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .3px; }
#title.long { font-size: 15px; letter-spacing: 0; }
#title.xlong { font-size: 13px; }
#coins { flex: none; display: flex; align-items: center; gap: 4px; background: linear-gradient(#352a6e, #1d1742); border-radius: 20px; padding: 6px 10px 6px 7px; font-weight: 900; font-size: 15px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 -2px 4px rgba(0,0,0,.35), 0 0 0 1px rgba(255,210,63,.35), 0 3px 8px rgba(10,4,30,.3); text-shadow: 0 1px 0 rgba(0,0,0,.4); }
#coins svg { width: 22px; height: 22px; }
#coins.bump { animation: bump .35s; }
@keyframes bump { 40% { transform: scale(1.25); } }
#stage { position: relative; flex: 1; overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#ctrls { position: absolute; top: 6px; left: 8px; right: 8px; display: none; gap: 8px; align-items: center; z-index: 10; pointer-events: none; }
#ctrls.on { display: flex; }
#ctrls button { pointer-events: auto; height: 42px; border: 0; border-radius: 14px; background: linear-gradient(rgba(84,66,150,.92), rgba(42,31,72,.88)); color: #fff;
  font-weight: 900; font-size: 15px; display: flex; align-items: center; gap: 6px; padding: 0 12px;
  box-shadow: inset 0 1.5px 0 rgba(255,255,255,.3), 0 3px 0 rgba(0,0,0,.35), 0 6px 12px rgba(15,6,40,.25); }
#ctrls button:active { transform: translateY(2px); }
#ctrls button:disabled { opacity: .4; }
#ctrls svg { width: 22px; height: 22px; }
#ctrls .sp { flex: 1; }
#bSpeed.fast { background: linear-gradient(#ffc46e, #ff9a2e 60%, #f2861a); color: var(--ink); }
#lvlStars { font-size: 16px; letter-spacing: 1px; color: var(--yellow); text-shadow: 0 2px 0 var(--ink); }
#hint { position: absolute; left: 14px; right: 14px; top: 64px; z-index: 12; pointer-events: none; background: rgba(255,255,255,.96); color: var(--ink);
  border-radius: 16px; padding: 12px 14px; font-weight: 800; font-size: 16px; line-height: 1.3; background: linear-gradient(#ffffff, #fff4e6);
  box-shadow: inset 0 -2px 0 rgba(0,0,0,.06), 0 6px 0 rgba(0,0,0,.22), 0 10px 22px rgba(20,8,50,.3);
  opacity: 0; transform: translateY(-10px); transition: .3s; }
#hint.on { opacity: 1; transform: none; }
.screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; overflow: hidden; padding: 14px; z-index: 5; }
.screen.on { display: flex; }
.btn { --edge: #c99a00; min-height: 58px; border: 0; border-radius: 18px; font-weight: 900; font-size: 20px; color: var(--ink);
  background: linear-gradient(#ffe680, #ffd23f 52%, #ffbe1a);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.7), inset 0 -3px 0 rgba(0,0,0,.08), 0 6px 0 var(--edge), 0 11px 18px rgba(25,8,55,.35);
  padding: 0 22px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-shadow: 0 1px 0 rgba(255,255,255,.45); }
.btn:active { transform: translateY(4px); box-shadow: inset 0 2px 0 rgba(255,255,255,.6), 0 2px 0 var(--edge), 0 4px 8px rgba(25,8,55,.3); }
.btn.alt { --edge: #c94d86; background: linear-gradient(#ffaad3, #ff7eb9 52%, #ff63a8); }
.btn.blue { --edge: #1f8db0; background: linear-gradient(#86e3ff, #3cc8f4 52%, #1fb2e3); }
.btn.green { --edge: #1f9c57; background: linear-gradient(#86f0b6, #3ddc84 52%, #24c46e); }
.btn.small { min-height: 48px; font-size: 17px; }
/* home */
#home { justify-content: center; gap: 14px; }
.logo { font-size: 52px; font-weight: 1000; line-height: .95; text-align: center; color: var(--yellow); letter-spacing: 1px;
  text-shadow: 0 4px 0 #ff7eb9, 0 8px 0 var(--ink), 3px 3px 0 var(--ink), -3px 3px 0 var(--ink), 3px -3px 0 var(--ink), -3px -3px 0 var(--ink);
  transform: rotate(-4deg); margin-bottom: 4px; animation: wob 2.4s ease-in-out infinite; }
@keyframes wob { 50% { transform: rotate(-1deg) scale(1.03); } }
.sub { font-weight: 800; font-size: 16px; opacity: .9; text-align: center; margin-bottom: 14px; text-shadow: 0 2px 0 var(--ink); }
#home .btn { width: min(320px, 86vw); }
.tipline { font-size: 13px; opacity: .8; text-align: center; max-width: 320px; }
/* level select */
.scroll { width: 100%; max-width: 440px; flex: 1; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; padding-bottom: 20px; }
.h { font-size: 24px; font-weight: 900; margin: 6px 0 12px; text-shadow: 0 3px 0 var(--ink); text-align: center; }
.daily { width: 100%; display: flex; align-items: center; gap: 12px; background: linear-gradient(135deg,#ffb04e,#ff8a8a 55%,#ff6fb0); border-radius: 20px; padding: 12px 14px; color: var(--ink);
  border: 0; box-shadow: inset 0 2px 0 rgba(255,255,255,.55), 0 6px 0 #b84a7c, 0 11px 18px rgba(25,8,55,.3); margin-bottom: 16px; text-align: left; }
.daily:active { transform: translateY(3px); }
.daily b { font-size: 20px; display: block; }
.daily span { font-weight: 700; font-size: 14px; }
.daily .ico { font-size: 34px; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 10px; padding-top: 6px; }
#albumInner .grid { grid-template-columns: repeat(3, 1fr); gap: 12px; }
.tile { aspect-ratio: 1 / 1.12; border: 0; border-radius: 18px; background: linear-gradient(#7363cf, #574aa6 50%, #4b3f98); color: #fff;
  box-shadow: inset 0 1.5px 0 rgba(255,255,255,.3), 0 6px 0 #231c4c, 0 10px 14px rgba(15,6,40,.25);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px; position: relative; }
.tile:active { transform: translateY(3px); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.3), 0 3px 0 #231c4c; }
.tile .n { font-size: 26px; font-weight: 1000; text-shadow: 0 3px 0 var(--ink); }
.tile .nm { font-size: 11px; font-weight: 800; opacity: .95; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .st { font-size: 13px; color: var(--yellow); letter-spacing: 1px; text-shadow: 0 2px 0 var(--ink); }
.tile img { width: 62%; image-rendering: pixelated; border-radius: 8px; border: 3px solid var(--ink); }
.tile.locked { background: linear-gradient(#463c84, #3a3170); opacity: .75; }
.tile.next { background: linear-gradient(#ffbc66, #ff9a2e 55%, #f4851a); color: var(--ink); animation: pulse 1.2s infinite; }
.tile.next .n { text-shadow: none; }
.tile.hard { background: linear-gradient(160deg, #ffa060, #ff8a3d 30%, #d9435a); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.4), 0 6px 0 #7d1f35, 0 10px 14px rgba(15,6,40,.25); }
.tile.vhard { background: linear-gradient(160deg, #7a3caf, #5b2a86 30%, #2b1240); box-shadow: 0 6px 0 #12081d, 0 0 0 2px #ff4d5e inset, 0 10px 14px rgba(15,6,40,.3); }
.tile.locked.hard, .tile.locked.vhard { opacity: .8; }
.tile.next.hard, .tile.next.vhard { color: #fff; }
.tile .tbadge { position: absolute; top: -7px; left: 50%; transform: translateX(-50%); white-space: nowrap; }
.tile.hard .n, .tile.vhard .n { margin-top: 6px; }
/* tier badges */
.tbadge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px 3px 5px; border-radius: 999px; font-weight: 900; font-size: 14px;
  color: #fff; border: 2px solid var(--ink); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.45), 0 2px 0 var(--ink); line-height: 1; vertical-align: middle; white-space: nowrap; }
.tbadge .ti { width: 20px; height: 20px; flex: none; }
.tbadge.hard { background: linear-gradient(#ff9a2e, #ff4d5e); }
.tbadge.vhard { background: linear-gradient(#7a2fb0, #2b1240); color: #ffd23f; }
.tbadge.sm { font-size: 10px; padding: 2px 6px 2px 3px; gap: 2px; }
.tbadge.sm .ti { width: 14px; height: 14px; }
.legend { text-align: center; font-weight: 800; font-size: 12px; margin: -4px 0 16px; opacity: .95; }
.sum .tb { color: #c2410c; }
#tierChip { pointer-events: none; display: none; }
#tierChip.on { display: inline-flex; }
/* hard / very hard: make room for the difficulty chip (undo shows icon only, compact stars) */
#ctrls.tiered { gap: 6px; }
#ctrls.tiered #undoN { display: none; }
#ctrls.tiered #lvlStars { font-size: 13px; letter-spacing: 0; }
#tierIntro { position: absolute; left: 50%; top: 38%; z-index: 14; pointer-events: none; transform: translate(-50%, -50%) scale(.5); opacity: 0;
  text-align: center; width: max-content; max-width: 94vw; transition: opacity .25s, transform .35s cubic-bezier(.3,1.7,.5,1); }
#tierIntro.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
#tierIntro .tbadge { font-size: 30px; padding: 8px 18px 8px 10px; border-width: 4px; box-shadow: 0 6px 0 var(--ink); gap: 8px; }
#tierIntro .tbadge .ti { width: 44px; height: 44px; }
#tierIntro .tsub { margin-top: 12px; font-weight: 900; font-size: 16px; color: #fff; text-shadow: 0 2px 0 var(--ink), 0 0 6px var(--ink); }
#tierIntro.x .tbadge { animation: throb .6s ease-in-out infinite alternate; }
@keyframes throb { to { transform: scale(1.06) rotate(-2deg); } }
@keyframes pulse { 50% { transform: scale(1.04); } }
/* album */
.card { border-radius: 18px; background: linear-gradient(#7363cf, #574aa6 50%, #4b3f98); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.3), 0 6px 0 #231c4c, 0 10px 14px rgba(15,6,40,.25);
  padding: 8px; text-align: center; border: 0; color: #fff; }
.card img { width: 100%; image-rendering: pixelated; border-radius: 10px; border: 3px solid var(--ink); display: block; }
.card b { display: block; font-size: 15px; margin-top: 4px; }
.card small { display: block; font-size: 11px; opacity: .85; font-weight: 700; min-height: 2.4em; }
.card.special { background: linear-gradient(160deg,#ffe680,#ffd23f 35%,#ff9a2e); color: var(--ink); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.6), 0 6px 0 #b86f00, 0 10px 14px rgba(15,6,40,.25); }
.card.lock { background: linear-gradient(#463c84, #3a3170); color: #cfc6f5; }
.card { position: relative; }
.card.family { background: linear-gradient(160deg,#ffb0d4,#ff8fc0 35%,#ff5f9a); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.55), 0 6px 0 #b8336b, 0 10px 16px rgba(120,20,70,.3); }
.card.family.lock { background: linear-gradient(160deg,#8a5a9c,#7a4a8c 35%,#5b3a7a); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.25), 0 6px 0 #2e1d48; color: #ffd9ea; }
.card.family img { border-color: #ffd23f; box-shadow: 0 0 0 3px #ff5f9a, 0 0 12px 2px rgba(255,210,63,.8); }
.card.family.lock img { border-color: #8a5aa0; box-shadow: none; }
.bigport.family { border-color: #ffd23f !important; box-shadow: 0 0 0 5px #ff5f9a, 0 0 22px 4px rgba(255,210,63,.85); }
.card .heart { position: absolute; top: 2px; right: 4px; font-style: normal; font-size: 18px; color: #ff2f6d; text-shadow: 0 2px 0 var(--ink); z-index: 1; }
/* modal */
#modal { position: absolute; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; background: rgba(20,12,40,.6); padding: 16px; }
#modal.on { display: flex; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
#modalCard { width: min(380px, 100%); max-height: 100%; overflow-y: auto; background: linear-gradient(#fffdf7, #fff4e2); color: var(--ink); border-radius: 26px; padding: 20px 18px; text-align: center;
  box-shadow: inset 0 2px 0 #fff, inset 0 -3px 0 rgba(120,80,30,.08), 0 10px 0 rgba(0,0,0,.28), 0 20px 40px rgba(15,5,40,.4); animation: pop .35s cubic-bezier(.3,1.6,.5,1); touch-action: pan-y; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }
#modalCard h2 { margin: 0 0 8px; font-size: 28px; font-weight: 1000; }
#modalCard p { font-weight: 700; font-size: 16px; line-height: 1.35; margin: 6px 0 12px; }
#modalCard .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
#modalCard .row .btn { flex: 1; min-width: 130px; }
.bigport { width: 60%; image-rendering: pixelated; border-radius: 16px; border: 5px solid var(--ink); animation: pop .5s cubic-bezier(.3,1.6,.5,1); }
.stars { font-size: 44px; letter-spacing: 4px; margin: 6px 0; }
.stars span { display: inline-block; color: #d7cfe6; transform: scale(.4); transition: .3s cubic-bezier(.3,1.8,.5,1); text-shadow: 0 3px 0 var(--ink); }
.stars span.on { color: var(--yellow); transform: scale(1); }
.sum { text-align: left; background: linear-gradient(#ece0cb, #f4ead9); box-shadow: inset 0 2px 4px rgba(90,60,20,.15); border-radius: 14px; padding: 10px 14px; font-weight: 800; font-size: 15px; }
.sum div { display: flex; justify-content: space-between; padding: 2px 0; }
.sum .tot { border-top: 2px dashed #cbb99a; margin-top: 4px; padding-top: 6px; font-size: 18px; }
.tipcv { width: 120px; height: 72px; image-rendering: pixelated; }
#toast { position: absolute; left: 50%; bottom: 24px; transform: translate(-50%, 30px); background: #fff; color: var(--ink); font-weight: 800; padding: 12px 16px;
  border-radius: 14px; z-index: 50; opacity: 0; transition: .3s; width: max-content; max-width: 90%; text-align: center; pointer-events: none; background: linear-gradient(#ffffff, #fff1e0);
  box-shadow: inset 0 -2px 0 rgba(0,0,0,.06), 0 5px 0 rgba(0,0,0,.22), 0 10px 20px rgba(20,8,50,.3); }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
/* 1.1: main-menu button, two-line in-level title, quit + goodbye screen, version label */
#title.two { font-size: 15px; line-height: 1.05; letter-spacing: 0; }
#title.two .sep { display: none; }
#title.two small { display: block; font-size: 12px; font-weight: 800; opacity: .85; overflow: hidden; text-overflow: ellipsis; }
#topbar .ib { width: 44px; height: 44px; }
#topbar { gap: 5px; }
.btn.quit { --edge: #1b1440; background: linear-gradient(#5e5096, #3f3478 55%, #352b68); color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.35); min-height: 46px; font-size: 16px; }
#home .btn.quit { width: min(200px, 60vw); margin-top: 2px; }
.ver { position: absolute; right: 12px; bottom: 8px; font-size: 11px; font-weight: 800; opacity: .45; letter-spacing: .5px; pointer-events: none; }
#bye { justify-content: center; gap: 10px; text-align: center; }
#bye h2 { margin: 6px 0 0; font-size: 30px; font-weight: 1000; color: var(--yellow); text-shadow: 0 3px 0 var(--ink), 2px 2px 0 var(--ink), -2px 2px 0 var(--ink); }
#bye p { margin: 0 0 10px; font-weight: 800; font-size: 17px; text-shadow: 0 2px 0 var(--ink); max-width: 300px; }
#bye .btn { width: min(280px, 80vw); }
.byedog { width: 150px; height: 150px; image-rendering: pixelated; border-radius: 22px; border: 5px solid #ffd23f; box-shadow: 0 0 0 5px #ff5f9a, 0 10px 24px rgba(15,5,40,.4); }
#bTilt { position: absolute; right: 8px; bottom: 8px; z-index: 11; display: none; align-items: center; gap: 5px; height: 36px; padding: 0 11px 0 8px; border: 0; border-radius: 18px;
  color: #fff; font-weight: 900; font-size: 13px; background: linear-gradient(rgba(84,66,150,.92), rgba(42,31,72,.88)); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.3), 0 3px 0 rgba(0,0,0,.35); }
#bTilt.on { display: flex; }
#bTilt.off { opacity: .6; }
#bTilt svg { width: 20px; height: 20px; }
.dline { display: inline-block; margin-top: 4px; font-size: 14px; font-weight: 700; font-style: italic; color: #6b4a2a; }

</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <button class="ib" id="bBack" aria-label="Til baka"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="ib gone" id="bHome" aria-label="Aðalvalmynd"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11.5L12 4l8.5 7.5"/><path d="M6 10v9.5h4.2v-5.5h3.6v5.5H18V10"/></svg></button>
    <div id="title">Betri Hundar</div>
    <div id="coins" aria-label="Nammi"><svg viewBox="0 0 24 24"><path d="M6 9a2.5 2.5 0 1 1 3-3l6 6a2.5 2.5 0 1 1 3 3 2.5 2.5 0 1 1-3 3l-6-6a2.5 2.5 0 1 1-3-3z" fill="#fff3d6" stroke="#2a1f3d" stroke-width="1.6" transform="rotate(0 12 12)"/></svg><span id="coinN">0</span></div>
    <button class="ib" id="bMute" aria-label="Hljóð"></button>
    <button class="ib" id="bFS" aria-label="Fullur skjár"></button>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="ctrls">
      <button id="bUndo" aria-label="Afturkalla"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span id="undoN">Afturkalla</span></button>
      <span class="sp"></span><span id="tierChip"></span><span id="lvlStars">★★★</span><span class="sp"></span>
      <button id="bRestart" aria-label="Byrja aftur"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
      <button id="bSpeed" aria-label="Hraði">1×</button>
    </div>
    <button id="bTilt" aria-label="Hallastýring"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><rect x="8" y="3.5" width="8" height="15" rx="1.8" transform="rotate(-18 12 11)"/><path d="M3.5 17.5a9 9 0 0 0 5 3.2M20.5 17.5a9 9 0 0 1-5 3.2" stroke-linecap="round"/></svg><span>Halla: Á</span></button>
    <div id="hint"></div>
    <div id="tierIntro"></div>
    <section id="home" class="screen">
      <div class="logo">Betri<br>Hundar</div>
      <div class="sub">Sendu hundana út – bjargaðu hvuttunum!</div>
      <button class="btn" id="hPlay">▶ Spila</button>

function nextLevelId() { for (const l of PL.LEVELS) if (!save.stars[l.id]) return l.id; return PL.LEVELS[PL.LEVELS.length - 1].id; }

/* ===== Pixel art: colour helpers, dog sprites, portraits, blocks, doghouses ===== */
const OUTLINE = '#2a1f3d';

const colHex = c => PL.COLORS[c].hex;

/* --- pack dog sprites, built procedurally on a pixel grid then auto-outlined --- */
const SPR = {};
function dogGrid(breed, frame) {
  const W = (breed === 'd' ? 21 : 19) + 2, H = 14 + 2;
  const g = Array.from({ length: H }, () => Array(W).fill('.'));

  const P = (x, y, ch) => R(x, y, x, y, ch);

    if (frame) { P(0, 4, 'b'); P(1, 5, 'b'); } else { P(0, 6, 'b'); P(1, 6, 'b'); }
    R(2, 5, 15, 8, 'b'); R(4, 8, 13, 8, 'w');
    R(14, 2, 17, 6, 'b'); R(17, 4, 19, 6, 'b'); R(17, 6, 19, 6, 'w'); P(19, 4, 'n'); P(16, 3, 'e');
    R(14, 3, 15, 7, 'd'); R(14, 7, 15, 7, 'c');
    if (frame) { R(2, 9, 3, 9, 'b'); R(13, 9, 14, 9, 'b'); P(1, 10, 'b'); P(15, 10, 'b'); }
    else { R(4, 9, 5, 10, 'b'); R(11, 9, 12, 10, 'b'); P(18, 7, 't'); }
  } else {
    const husky = breed === 'h';
    if (husky) { R(0, 1, 1, 2, 'b'); P(1, 3, 'w'); P(2, 4, 'b'); }
    else if (frame) { P(0, 1, 'b'); P(1, 2, 'b'); P(2, 3, 'b'); } else { P(0, 4, 'b'); P(1, 4, 'b'); P(2, 4, 'b'); }
    R(2, 4, 11, 8, 'b'); R(4, 8, 10, 8, 'w');
    R(10, 2, 12, 7, 'b');
    R(11, 0, 15, 4, 'b'); R(15, 2, 17, 4, 'b'); R(15, 4, 17, 4, 'w'); P(17, 2, 'n'); P(13, 1, 'e');
    if (husky) { R(13, 3, 15, 4, 'w'); P(12, -1, 'd'); P(12, -2, 'd'); P(14, -1, 'd'); P(14, -2, 'd'); P(11, 0, 'd'); R(9, 6, 12, 7, 'w'); }
    else R(11, 1, 12, 4, 'd');
    R(10, 5, 12, 5, 'c');
    if (frame) { R(1, 9, 2, 11, 'b'); R(12, 9, 13, 11, 'b'); } else { R(3, 9, 4, 11, 'b'); R(9, 9, 10, 11, 'b'); P(16, 5, 't'); }
  }

}
function dogSprite(breed, col, frame) {
  const key = breed + col + frame;
  if (SPR[key]) return SPR[key];
  const g = dogGrid(breed, frame), H = g.length, W = g[0].length;
  const base = col.length === 1 ? colHex(col) : col;

  const s = dogSprite(breed, col, frame);

const slotPos = k => ({ x: L.pad + L.slotW * (k + 0.5), y: L.slotY + L.slotH * 0.5 });

const cellPos = i => ({ x: L.bx + (i % G.p.w + 0.5) * L.cell, y: L.by + (((i / G.p.w) | 0) + 0.5) * L.cell });

/* ---------- input ---------- */
function gameTap(x, y) {
  if (!G || G.over || G.won || G.paused) return;
  if (y < L.lanesY - 14) return;
  const i = Math.max(0, Math.min(G.p.lanes.length - 1, Math.floor((x - L.pad) / L.laneW)));
  tapLane(i);
}
function tapLane(i) {
  const snap = { s: PL.clone(G.s), eaten: G.eaten, clears: G.clears, comboBonus: G.comboBonus, cleared: Object.assign({}, G.clearedShown) };
  const ev = [];
  const r = PL.place(G.s, i, ev);
  if (r === -1) { Snd.deny(); return; }
  if (r === -2) { Snd.deny(); G.denyT = 0.5; floatText(W / 2, L.slotY - 8, 'Allir taumar uppteknir!', '#ff6b8b', 16); vibrate(30); return; }
  G.undo.push(snap); G.hintTaps++;
  if (G.hintTaps >= 2) hideHint();
  G.laneAnim[i] = 1;
  Snd.place(); vibrate(12);
  handleEvents(ev, i);
  updateCtrls();
}
function doUndo() {
  if (!G || !G.undo.length || G.won) return;
  const u = G.undo.pop();
  G.s = u.s; G.eaten = u.eaten; G.clears = u.clears; G.comboBonus = u.comboBonus; G.clearedShown = u.cleared;
  G.undos++; G.runners = []; G.sleds = []; G.pending.clear(); G.over = false; G.loseT = 0; G.bdirty = true;
  G.packs = G.s.slots.map((p, k) => p && makePackVis(p, k, null)).filter(Boolean);
  closeModal(); Snd.whoosh(); updateCtrls();
  floatText(W / 2, L.by + L.bh / 2, 'Afturkallað', '#fff', 20);
}

/* ---------- logic events -> visuals ---------- */
function makePackVis(p, k, fromLane) {
  const sp = slotPos(k);
  const pv = { id: p.id, slot: k, c: p.c, b: p.b, total: p.n, shown: p.n, out: 0, homeAfter: false, leaving: 0, t: 0, x: sp.x, y: sp.y, seed: Math.random() * 4 };
  if (fromLane != null) pv.fly = { x0: laneX(fromLane), y0: L.lanesY + L.houseH * 0.5, t: 0 };
  return pv;
}
const packById = id => G.packs.find(p => p.id === id);
function handleEvents(ev, lane) {
  for (const e of ev) {
    if (e.t === 'eat' || e.t === 'sled') G.bdirty = true;
    if (e.t === 'place') { G.packs.push(makePackVis(e.p, e.slot, lane)); }
    else if (e.t === 'eat') {
      const pv = packById(e.id), sp = slotPos(e.slot), cp = cellPos(e.cell);
      const dist = Math.hypot(cp.x - sp.x, cp.y - sp.y);
      G.runners.push({ pid: e.id, c: e.c, b: e.b, cell: e.cell, sx: sp.x, sy: sp.y - 6, tx: cp.x, ty: cp.y + L.cell * 0.35, t: 0, dur: 0.16 + dist / 900, phase: 0, seed: Math.random() * 9 });
      G.pending.set(e.cell, e.c);
      if (pv) pv.out++;
    } else if (e.t === 'home') { const pv = packById(e.id); if (pv) pv.homeAfter = true; }
    else if (e.t === 'sled') {
      const pv = packById(e.id);
      e.cells.forEach(i => G.pending.set(i, e.c));
      G.sleds.push({ pid: e.id, c: e.c, row: e.row, cells: e.cells.slice(), t: -0.25, popped: 0 });
      if (pv) pv.out++;
      Snd.sled(); G.shake = Math.max(G.shake, 4);
    }
  }
}
function eatVisual(cell, c, pid) {
  G.pending.delete(cell);
  G.eaten++;
  const cp = cellPos(cell);
  G.chain++; G.chainT = 0.7;
  Snd.crunch(G.chain);
  const base = colHex(c);
  for (let k = 0; k < 6; k++) G.parts.push({ x: cp.x, y: cp.y, vx: (Math.random() - 0.5) * 220, vy: -Math.random() * 220 - 40, life: 0.5 + Math.random() * 0.3, max: 0.8, col: k < 4 ? base : '#fff', size: L.cell * (0.12 + Math.random() * 0.14), g: 700 });
  // sparkle burst: a quick colour ring + a few glowing 4-point stars (cached sprite, additive)
  G.parts.push({ ring: true, x: cp.x, y: cp.y, life: 0.32, max: 0.32, col: shade(base, 0.5), size: L.cell * 1.1 });
  const ns = G.sleds.length ? 1 : 3;   // husky sleds eat a whole row at once: keep it light
  for (let k = 0; k < ns; k++) { const a = Math.random() * 6.28, sp = 30 + Math.random() * 70;
    G.parts.push({ spark: true, x: cp.x, y: cp.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30, life: 0.38 + Math.random() * 0.22, max: 0.6, col: base, size: L.cell * (1.5 + Math.random() * 1.0), g: 60, rot: Math.random() * 1.6, vr: (Math.random() - 0.5) * 6 }); }
  const pv = packById(pid); if (pv) pv.shown = Math.max(0, pv.shown - 1);
  if (G.s.rem[c] === 0 && !G.clearedShown[c] && ![...G.pending.values()].includes(c)) colourCleared(c);
}
function colourCleared(c) {
  G.clearedShown[c] = true; G.clears++;
  const combo = (G.time - G.lastClearT < 6) ? ++G.comboN : (G.comboN = 1);
  G.lastClearT = G.time;
  const bonus = 10 * combo; G.comboBonus += bonus;
  const nm = PL.COLORS[c].name;
  banner(`Allt ${nm} nammið búið!`, combo > 1 ? `COMBO ×${combo}  +${bonus}` : `+${bonus} nammi`, colHex(c));
  Snd.clear(); if (combo > 1) Snd.combo(combo);
  G.flash = 0.5; G.flashCol = colHex(c); G.shake = Math.max(G.shake, 6 + combo * 2);
  confetti(W / 2, L.by + L.bh * 0.5, 40 + combo * 15, [colHex(c), '#fff', '#ffd23f']);
  vibrate(25);
}

/* ---------- juice helpers ---------- */
function floatText(x, y, txt, col, size = 18, life = 1.1) { (G || F).texts.push({ x, y, txt, col, size, life, max: life }); }
function banner(a, b, col) { G.banners.push({ a, b, col, t: 0, life: 2.0 }); }
function confetti(x, y, n, cols, target) {
  const arr = (target || G).parts;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 150 + Math.random() * 420;
    arr.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 250, life: 1.2 + Math.random() * 1.2, max: 2.4, col: cols[i % cols.length], size: 4 + Math.random() * 5, g: 520, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 18, conf: true });
  }
}
function vibrate(ms) { try { if (!save.mute && navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

/* ---------- update ---------- */
function updateGame(dt) {
  if (!G) return;
  const sp = save.speed || 1;
  G.time += dt;
  if (!G.paused && !G.over && !G.won) {
    G.acc += dt * sp;
    let guard = 0;
    while (G.acc >= TICK && guard++ < 6) {
      G.acc -= TICK;
      const ev = []; PL.tick(G.s, ev); if (ev.length) handleEvents(ev);
    }
    if (G.acc > TICK) G.acc = 0;
  }
  const vdt = dt * sp;
  // runners
  for (const r of G.runners) {
    r.t += vdt;
    if (r.phase === 0 && r.t >= r.dur) { r.phase = 1; r.t = 0; eatVisual(r.cell, r.c, r.pid); }
    else if (r.phase === 1 && r.t >= 0.12) { r.phase = 2; r.t = 0; }
    else if (r.phase === 2 && r.t >= r.dur * 0.85) { r.done = true; const pv = packById(r.pid); if (pv) pv.out--; }
  }
  G.runners = G.runners.filter(r => !r.done);
  // husky sleds
  for (const sl of G.sleds) {
    sl.t += vdt;
    const prog = sl.t / 0.6, row0 = sl.cells[0] % G.p.w, row1 = sl.cells[sl.cells.length - 1] % G.p.w;
    const xNow = row0 + (row1 - row0 + 1) * prog;
    while (sl.popped < sl.cells.length && (sl.cells[sl.popped] % G.p.w) + 0.5 <= xNow) { eatVisual(sl.cells[sl.popped], sl.c, sl.pid); sl.popped++; }
    if (prog >= 1.25 && sl.popped >= sl.cells.length) { sl.done = true; const pv = packById(sl.pid); if (pv) pv.out--; }
  }
  G.sleds = G.sleds.filter(s => !s.done);
  // packs
  for (const pv of G.packs) {
    pv.t += dt;
    if (pv.fly) { pv.fly.t += dt / 0.3; if (pv.fly.t >= 1) pv.fly = null; }
    const lp = G.s.slots[pv.slot];
    pv.wait = !!(lp && lp.id === pv.id && lp.wait);
    if (pv.homeAfter && pv.out <= 0 && !pv.leaving) { pv.leaving = 0.001; Snd.bark(1.5, 0, 0.18); }
    if (pv.leaving) { pv.leaving += dt / 0.45; if (pv.leaving >= 1) pv.gone = true; }
  }
  G.packs = G.packs.filter(p => !p.gone);
  for (let i = 0; i < G.laneAnim.length; i++) G.laneAnim[i] = Math.max(0, G.laneAnim[i] - dt * 5);
  if (G.chainT > 0) { G.chainT -= dt; if (G.chainT <= 0) { if (G.chain >= 15) floatText(W / 2, L.by + L.bh - 10, `Namm ×${G.chain}!`, '#ffd23f', 22); G.chain = 0; } }
  stepParts(G.parts, dt); stepTexts(G.texts, dt);
  for (const b of G.banners) b.t += dt; G.banners = G.banners.filter(b => b.t < b.life);
  G.shake = Math.max(0, G.shake - dt * 30); G.flash = Math.max(0, G.flash - dt * 1.5); G.denyT = Math.max(0, G.denyT - dt);
  // win / lose
  if (!G.won && !G.over && PL.isWon(G.s) && !G.pending.size && !G.runners.length && !G.sleds.length) winLevel();
  if (!G.won && !G.over && G.s.slots.every(Boolean) && !G.runners.length && !G.sleds.length && PL.isStuck(G.s)) {
    G.loseT += dt; if (G.loseT > 0.7) loseLevel();
  } else G.loseT = 0;
  if (G.won) { G.wonT += dt; G.revealT = Math.min(1, G.revealT + dt * 0.8); if (G.wonT > 2.6 && !G.toFinale) { G.toFinale = true; startFinale(); } }
}
function stepParts(arr, dt) {
  for (const p of arr) { p.life -= dt; p.vy += (p.g || 0) * dt; p.vx *= (p.conf ? 0.985 : 1); p.x += p.vx * dt; p.y += p.vy * dt; if (p.rot != null) p.rot += p.vr * dt; }
  for (let i = arr.length - 1; i >= 0; i--) if (arr[i].life <= 0) arr.splice(i, 1);
}
function stepTexts(arr, dt) { for (const t of arr) { t.life -= dt; t.y -= 34 * dt; } for (let i = arr.length - 1; i >= 0; i--) if (arr[i].life <= 0) arr.splice(i, 1); }

function winLevel() {
  G.won = true; G.wonT = 0; hideHint(); G.banners = [];
  Snd.win(); vibrate([30, 60, 30]);
  confetti(W / 2, L.by + L.bh / 2, 140, ['#ff4d5e', '#ffd23f', '#3ddc84', '#3cc8f4', '#ff7eb9', '#9b5de5']);
  G.shake = 14;
  banner('Bjargað!', `${G.dog.name} er frjáls!`, '#ffd23f');
  updateCtrls();
}
function loseLevel() {
  G.over = true; Snd.lose(); vibrate(80);
  openModal(`<h2>Æ nei! 🐾</h2><p>Allir 5 taumarnir eru fullir og enginn hundur nær í nammi.</p>
    <div class="row">${G.undo.length ? '<button class="btn" data-act="undo">↶ Afturkalla</button>' : ''}
    <button class="btn alt" data-act="restart">⟲ Reyna aftur</button></div>`);
}

/* ---------- render ---------- */
function renderGame() {
  if (!G) return;
  const t = G.time;
  ctx.save();
  if (G.shake > 0) ctx.translate((Math.random() - 0.5) * G.shake, (Math.random() - 0.5) * G.shake);
  drawBackdrop(t);   // (also contains the glossy board frame, baked into the cached backdrop layer)
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(portrait(G.dog), L.bx, L.by, L.bw, L.bh);
  // blocks: static ones come from a cached layer (redrawn only when the board changes); blocks a runner is
  // on its way to eat are drawn live with a little wobble
  const s = G.s, cs = L.cell;
  ctx.drawImage(boardLayer(), L.bx, L.by, L.bw, L.bh);
  if (G.pending.size) {
    const pxs = Math.round(cs * DPR);
    for (const [i, c] of G.pending) {
      if (s.cells[i]) continue;
      const x = L.bx + (i % s.w) * cs, y = L.by + ((i / s.w) | 0) * cs, k = 1 + Math.sin(t * 40 + i) * 0.08;
      ctx.drawImage(blockImg(c, pxs, false), x + cs * (1 - k) / 2, y + cs * (1 - k) / 2, cs * k, cs * k);
    }
  }
  // idle shimmer: a faint diagonal shine glides over the board every ~7s (one gradient, only while it is visible)
  const sh = (t % 7) / 0.9;
  if (!G.won && sh < 1) {
    ctx.save(); ctx.beginPath(); ctx.rect(L.bx, L.by, L.bw, L.bh); ctx.clip();
    const sx = L.bx - L.bw * 0.6 + sh * L.bw * 2.2, gr = ctx.createLinearGradient(sx, L.by, sx + L.bw * 0.35, L.by + L.bh * 0.5);
    gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.5, 'rgba(255,255,255,.13)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gr; ctx.fillRect(L.bx, L.by, L.bw, L.bh); ctx.restore();
  }
  if (G.flash > 0) { ctx.globalAlpha = G.flash * 0.5; ctx.strokeStyle = G.flashCol; ctx.lineWidth = 8; roundRect(ctx, L.bx - 4, L.by - 4, L.bw + 8, L.bh + 8, 10); ctx.stroke(); ctx.globalAlpha = 1; }
  if (G.won) { // shine sweep over the revealed portrait
    ctx.save(); roundRect(ctx, L.bx, L.by, L.bw, L.bh, 4); ctx.clip();
    const sx = L.bx - L.bw + G.revealT * L.bw * 2.4;
    const gr = ctx.createLinearGradient(sx, L.by, sx + L.bw * 0.4, L.by + L.bh);
    gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.5, 'rgba(255,255,255,.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gr; ctx.fillRect(L.bx, L.by, L.bw, L.bh); ctx.restore();
  }
  // husky sleds
  for (const sl of G.sleds) {
    const x0 = L.bx + (sl.cells[0] % s.w) * cs, x1 = L.bx + (sl.cells[sl.cells.length - 1] % s.w + 1) * cs;
    const y = L.by + (sl.row + 1) * cs - 2, x = x0 + (x1 - x0) * Math.max(0, sl.t / 0.6);
    ctx.fillStyle = '#c0392b'; roundRect(ctx, x - cs * 1.2, y - cs * 0.35, cs * 1.1, cs * 0.3, 4); ctx.fill();
    ctx.fillStyle = '#ffd23f'; ctx.fillRect(x - cs * 1.3, y - 3, cs * 1.4, 3);
    drawDog(ctx, 'h', sl.c, ((t * 12) | 0) % 2, x + cs * 0.2, y, L.unit, false);
    for (let k = 0; k < 2; k++) G.parts.push({ x: x - cs, y, vx: -60 - Math.random() * 80, vy: -Math.random() * 60, life: 0.4, max: 0.4, col: '#ffffff', size: 3 + Math.random() * 3, g: 100 });
  }
  drawSlots(t);
  drawLanes(t);
  // runners on top
  for (const r of G.runners) {
    let x, y, f = ((t * 12 + r.seed) | 0) % 2, flip;
    if (r.phase === 0) { const k = easeInOut(r.t / r.dur); x = r.sx + (r.tx - r.sx) * k; y = r.sy + (r.ty - r.sy) * k - Math.abs(Math.sin(k * Math.PI * 3)) * 6; flip = r.tx < r.sx; }
    else if (r.phase === 1) { x = r.tx; y = r.ty + Math.sin(r.t * 60) * 1.5; f = 0; flip = r.tx < r.sx; }
    else { const k = easeInOut(Math.min(1, r.t / (r.dur * 0.85))); x = r.tx + (r.sx - r.tx) * k; y = r.ty + (r.sy - r.ty) * k - Math.abs(Math.sin(k * Math.PI * 3)) * 6; flip = r.sx < r.tx; ctx.globalAlpha = 1 - k * 0.5; }
    drawDog(ctx, r.b, r.c, f, x, y, L.unit, flip);
    ctx.globalAlpha = 1;
  }
  drawParts(G.parts); drawTexts(G.texts);
  // tutorial pointer
  if (G.def.id === 1 && G.hintTaps === 0 && !G.won) {
    const hx = laneX(0) + 10, hy = L.lanesY + L.houseH * 0.7 + Math.abs(Math.sin(t * 4)) * -12;
    ctx.font = '40px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('👆', hx, hy + 30);
    ctx.globalAlpha = 0.5 + Math.sin(t * 6) * 0.3; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    roundRect(ctx, laneX(0) - L.houseW / 2 - 6, L.lanesY - 6, L.houseW + 12, L.houseH + 12, 14); ctx.stroke(); ctx.globalAlpha = 1;
  }
  drawBanners(G.banners);
  ctx.restore();
}
function boardLayer() {
  const s = G.s, pxs = Math.max(4, Math.round(L.cell * DPR)), key = pxs + 'x' + s.w + 'x' + s.h;
  if (!G.bc || G.bc.key !== key) { const c = document.createElement('canvas'); c.width = pxs * s.w; c.height = pxs * s.h; G.bc = { cv: c, ctx: c.getContext('2d'), key }; G.bdirty = true; }
  if (G.bdirty) {
    const b = G.bc.ctx, D = s.D; b.clearRect(0, 0, G.bc.cv.width, G.bc.cv.height);
    for (let i = 0; i < s.cells.length; i++) { const c = s.cells[i]; if (c) b.drawImage(blockImg(c, pxs, D[i] > 1), (i % s.w) * pxs, ((i / s.w) | 0) * pxs); }
    G.bdirty = false; G.layerDraws = (G.layerDraws || 0) + 1;
  }
  return G.bc.cv;
}
const easeInOut = k => k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
const easeOutBack = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };

/* Backdrop: the warm sky gradient, soft bokeh, the glossy board frame and the grass are baked into one offscreen
   canvas per layout (one drawImage per frame); only a few twinkles are drawn live. */
let BG = null;
function backdropLayer() {
  const key = [W, H, DPR, L.bx, L.by, L.bw, L.bh, L.slotY].join(',');
  if (BG && BG.key === key) return BG.cv;
  const P = 20, D = DPR, cv = document.createElement('canvas'); cv.width = Math.round((W + P * 2) * D); cv.height = Math.round((H + P * 2) * D);
  const c = cv.getContext('2d'); c.setTransform(D, 0, 0, D, Math.round(P * D), Math.round(P * D));
  const gy = L.slotY - 4, sky = c.createLinearGradient(0, -P, 0, gy);
  sky.addColorStop(0, '#3a2690'); sky.addColorStop(0.35, '#6a43c4'); sky.addColorStop(0.72, '#b55fc0'); sky.addColorStop(1, '#ffa77a');
  c.fillStyle = sky; c.fillRect(-P, -P, W + P * 2, H + P * 2);
  const glow = c.createRadialGradient(W / 2, L.by + L.bh * 0.45, 10, W / 2, L.by + L.bh * 0.45, Math.max(W, L.bh) * 0.8);
  glow.addColorStop(0, 'rgba(255,214,150,.30)'); glow.addColorStop(1, 'rgba(255,214,150,0)');
  c.fillStyle = glow; c.fillRect(-P, -P, W + P * 2, H + P * 2);
  for (let i = 0; i < 9; i++) {   // soft bokeh dots
    const x = (i * 131 + 40) % W, y = (i * 89 + 20) % Math.max(60, gy - 20), r = 14 + (i % 3) * 10, g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(255,240,255,.16)'); g.addColorStop(1, 'rgba(255,240,255,0)'); c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
  }
  // grass hill with a glossy lip
  c.beginPath(); c.moveTo(-P, gy); for (let x = -P; x <= W + P; x += 10) c.lineTo(x, gy + Math.sin(x * 0.05) * 4); c.lineTo(W + P, H + P); c.lineTo(-P, H + P); c.closePath();
  const gg = c.createLinearGradient(0, gy - 4, 0, H); gg.addColorStop(0, '#6fd47a'); gg.addColorStop(0.12, '#4fb867'); gg.addColorStop(1, '#2f8a4e');
  c.fillStyle = gg; c.fill();
  c.beginPath(); for (let x = -P; x <= W + P; x += 10) c.lineTo(x, gy + 2 + Math.sin(x * 0.05) * 4); c.strokeStyle = 'rgba(220,255,200,.55)'; c.lineWidth = 2; c.stroke();
  c.fillStyle = 'rgba(30,110,60,.55)'; for (let x = 6; x < W; x += 23) c.fillRect(x, L.slotY + 6 + ((x * 7) % 30), 3, 6);
  // glossy board frame with a soft drop shadow
  const bp = 6, fx = L.bx - bp, fy = L.by - bp, fw = L.bw + bp * 2, fh = L.bh + bp * 2;
  c.save(); c.shadowColor = 'rgba(20,8,45,.55)'; c.shadowBlur = 18; c.shadowOffsetY = 6;
  roundRect(c, fx, fy, fw, fh, 13); c.fillStyle = '#2a1f3d'; c.fill(); c.restore();
  const fr = c.createLinearGradient(0, fy, 0, fy + fh); fr.addColorStop(0, '#8a78e6'); fr.addColorStop(0.5, '#5546a8'); fr.addColorStop(1, '#3b2f80');

function fText(x, y, txt, col, size, life = 1.2) { F.texts.push({ x, y, txt, col, size, life, max: life }); }
function fBurst(x, y, n, cols, conf) {

function renderFinale() {
  if (!F) return;
  const v = fView(), t = F.t;
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#2d2370'); g.addColorStop(0.6, '#5b3d9f'); g.addColorStop(1, '#8a4f9e');

      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * s, 0, 7); ctx.fillStyle = p.lit ? '#bff3ff' : '#3cc8f4';

      ctx.fill(); ctx.shadowBlur = 0; ctx.lineWidth = 2; ctx.strokeStyle = OUTLINE; ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillRect(p.x - 3, p.y - 4, 2, 2);
    }
  }
  // launcher
  drawHouse(ctx, LAUNCH.x - 42, 14, 84, 70, 'O', null, 'l', { time: t, empty: F.state !== 'aim' && F.state !== 'intro' });
  // aim preview
  if (F.state === 'aim' || F.state === 'intro') {
    const b = { x: LAUNCH.x + Math.cos(F.aim) * 26, y: LAUNCH.y + Math.sin(F.aim) * 26, vx: Math.cos(F.aim) * SHOT, vy: Math.sin(F.aim) * SHOT };
    for (let i = 0; i < 48; i++) {
      for (let s = 0; s < 4; s++) physStep(b, 1 / 240);
      if (F.pegs.some(p => !p.pop && Math.hypot(b.x - p.x, b.y - p.y) < BALL_R + p.r)) break;
      if (i % 2 === 0) { ctx.globalAlpha = 1 - i / 48; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, 3.2, 0, 7); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
    drawDog(ctx, 'l', F.pupCol, ((t * 6) | 0) % 2, LAUNCH.x + Math.cos(F.aim) * 8, LAUNCH.y + 12 + Math.sin(t * 8) * 2, 2.1, Math.cos(F.aim) < 0);
  }

  for (const [ti, tr] of F.trail.entries()) { ctx.globalAlpha = tr.life * 1.5; ctx.fillStyle = F.fever ? RB[ti % RB.length] : '#ffd23f'; ctx.beginPath(); ctx.arc(tr.x, tr.y, BALL_R * tr.life * 2, 0, 7); ctx.fill(); }

  ctx.restore();

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '900 30px system-ui, Roboto, sans-serif'; ctx.lineWidth = 7; ctx.strokeStyle = OUTLINE;
  const title = 'Sæktu!';
  const ty = v.oy > 70 ? v.oy / 2 - 10 : v.oy + 128 * v.k;

    ctx.save(); ctx.translate(W / 2, ty); ctx.scale(sc, sc); ctx.strokeText(title, 0, 0); ctx.fillStyle = '#ffd23f'; ctx.fillText(title, 0, 0); ctx.restore();
    ctx.font = '800 15px system-ui, Roboto, sans-serif'; ctx.lineWidth = 5;
    const tip = 'Dragðu til að miða – slepptu til að kasta!';
    ctx.strokeText(tip, W / 2, ty + 30); ctx.fillStyle = '#fff'; ctx.fillText(tip, W / 2, ty + 30);
  }
  ctx.font = '900 17px system-ui'; ctx.lineWidth = 5;
  ctx.textAlign = 'left'; ctx.strokeText(`🦴 ${F.bones}/4`, v.ox + 12, v.oy + 22); ctx.fillStyle = '#ffd23f'; ctx.fillText(`🦴 ${F.bones}/4`, v.ox + 12, v.oy + 22);
  if (F.dbl) { ctx.textAlign = 'center'; ctx.strokeText('×2', W / 2, v.oy + 22); ctx.fillStyle = '#d9a6ff'; ctx.fillText('×2', W / 2, v.oy + 22); }
  ctx.textAlign = 'right'; ctx.strokeText(`✨ ${F.pts}`, v.ox + FW * v.k - 12, v.oy + 22); ctx.fillStyle = '#fff'; ctx.fillText(`✨ ${F.pts}`, v.ox + FW * v.k - 12, v.oy + 22);
  ctx.textAlign = 'center';
  if (F.tiltHint && tiltOn() && (F.state === 'aim' || F.state === 'intro' || (F.state === 'fly' && F.flyT < 2.5))) drawTiltHint(t, F.state === 'fly' ? v.oy + 52 : ty + 62);
  if (F.slow < 0.6) { ctx.fillStyle = `rgba(255,255,255,${0.08})`; ctx.fillRect(0, 0, W, H); }
}
function drawTiltHint(t, y) {   // little phone rocking left/right + text
  const a = Math.sin(t * 3) * 0.32, txt = 'Hallaðu símanum til að stýra boltanum';
  ctx.font = '800 14px system-ui, Roboto, sans-serif';
  const tw = ctx.measureText(txt).width, w = tw + 54, x0 = W / 2 - w / 2;
  ctx.fillStyle = 'rgba(30,18,64,.72)'; roundRect(ctx, x0, y - 17, w, 34, 17); ctx.fill();
  ctx.save(); ctx.translate(x0 + 22, y); ctx.rotate(a);
  ctx.fillStyle = '#fff'; roundRect(ctx, -7, -12, 14, 24, 3); ctx.fill(); ctx.fillStyle = '#3cc8f4'; ctx.fillRect(-5, -9, 10, 16);

function drawPartsF(arr) { drawParts(arr); }
function drawTextsW(arr) { drawTexts(arr); }

/* ===== Boot, canvas, input, main loop ===== */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 360, H = 640, DPR = 1, T = 0;
function resize() {
  const st = document.getElementById('stage');
  W = st.clientWidth; H = st.clientHeight; DPR = Math.min(2.5, window.devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  layoutGame();
}
const MENU_DOGS = [];
let MENU_BG = null;   // warm sky + glow + grass, baked once per size (one drawImage per frame)
function menuBgLayer() {
  const key = W + 'x' + H + 'x' + DPR;
  if (MENU_BG && MENU_BG.key === key) return MENU_BG.cv;
  const D = DPR, cv = document.createElement('canvas'); cv.width = Math.round(W * D); cv.height = Math.round(H * D);
  const c = cv.getContext('2d'); c.scale(D, D);
  const gy = H - 70, g = c.createLinearGradient(0, 0, 0, gy);
  g.addColorStop(0, '#3a2690'); g.addColorStop(0.4, '#6a43c4'); g.addColorStop(0.78, '#c064bc'); g.addColorStop(1, '#ffad7c');

  const gg = c.createLinearGradient(0, gy - 6, 0, H); gg.addColorStop(0, '#72d77c'); gg.addColorStop(0.2, '#4fb867'); gg.addColorStop(1, '#2f8a4e'); c.fillStyle = gg; c.fill();
  c.beginPath(); for (let x = 0; x <= W; x += 8) c.lineTo(x, gy + 2.5 + Math.sin(x * 0.04 + 1) * 6); c.strokeStyle = 'rgba(220,255,200,.55)'; c.lineWidth = 2; c.stroke();

}
function renderMenuBg(dt) {

  for (const d of MENU_DOGS) {
    d.x += d.s * dt; if (d.x > W + 60) d.x -= W + 480;

function pt(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
cv.addEventListener('pointerdown', e => {
  Snd.unlock(); const p = pt(e);
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  if (scr === 'game') gameTap(p.x, p.y); else if (scr === 'finale') finaleDown(p.x, p.y);
});
cv.addEventListener('pointermove', e => { if (scr === 'finale') { const p = pt(e); finaleMove(p.x, p.y); } });

document.addEventListener('pointerdown', () => Snd.unlock(), { once: false, passive: true });
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

let last = performance.now();

function frame(now) {
  const w0 = performance.now(), gap = now - last;
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now; T += dt;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.imageSmoothingEnabled = false;

  const wk = performance.now() - w0; FS.n++; FS.work += wk; FS.maxWork = Math.max(FS.maxWork, wk); FS.gaps += gap; FS.maxGap = Math.max(FS.maxGap, gap);

window.addEventListener('resize', resize);
if (window.visualViewport) visualViewport.addEventListener('resize', resize);

requestAnimationFrame(frame);
// Android back button -> in-game back
