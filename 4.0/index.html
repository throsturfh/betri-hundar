<!doctype html>
<html lang="is">
<head>

<link rel="manifest" href="manifest.json">

<style>
:root { --ink:#2a1f3d; --bg:#2b2350; --panel:#3d3275; --yellow:#ffd23f; --pink:#ff7eb9; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: #fff;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; touch-action: none; overscroll-behavior: none;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
button { font-family: inherit; touch-action: manipulation; cursor: pointer; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
#topbar { flex: none; height: 54px; display: flex; align-items: center; gap: 6px; padding: 0 8px; z-index: 30;
  background: linear-gradient(#5d4dbd, #3d3188 58%, #2f2665); box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 3px 0 rgba(0,0,0,.25), 0 6px 14px rgba(20,8,50,.3); }
.ib { flex: none; width: 46px; height: 46px; border: 0; border-radius: 14px; background: linear-gradient(#7767d2, #574aa6 55%, #4a3d98); color: #fff;
  display: grid; place-items: center; box-shadow: inset 0 1.5px 0 rgba(255,255,255,.35), inset 0 -2px 0 rgba(0,0,0,.12), 0 4px 0 #231c4c, 0 7px 10px rgba(15,6,40,.3); padding: 0; }
.ib:active { transform: translateY(3px); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.3), 0 1px 0 #231c4c; }
/* glossy cap: a soft white band over the top half, painted above the background but below the content */
.ib, .btn, .daily, #ctrls button, #coins, .tile, .card { position: relative; isolation: isolate; }
.ib::before, .btn::before, .daily::before, #ctrls button::before, #coins::before, .tile::before, .card::before {
  content: ''; position: absolute; left: 6%; right: 6%; top: 2px; height: 46%; border-radius: 12px 12px 40% 40% / 12px 12px 60% 60%;
  background: linear-gradient(rgba(255,255,255,.5), rgba(255,255,255,.06)); z-index: -1; pointer-events: none; }
.tile::before, .card::before { height: 34%; opacity: .55; }
.tile.locked::before, .card.lock::before { opacity: .25; }
#coins::before { opacity: .45; border-radius: 20px 20px 50% 50%; }
.ib svg { width: 26px; height: 26px; }
.ib.hide { visibility: hidden; }
.ib.gone { display: none; }
#title { flex: 1; min-width: 0; font-weight: 900; font-size: 18px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .3px; }
#title.long { font-size: 15px; letter-spacing: 0; }
#title.xlong { font-size: 13px; }
#coins { flex: none; display: flex; align-items: center; gap: 4px; background: linear-gradient(#352a6e, #1d1742); border-radius: 20px; padding: 6px 10px 6px 7px; font-weight: 900; font-size: 15px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 -2px 4px rgba(0,0,0,.35), 0 0 0 1px rgba(255,210,63,.35), 0 3px 8px rgba(10,4,30,.3); text-shadow: 0 1px 0 rgba(0,0,0,.4); }
#coins svg { width: 22px; height: 22px; }
#coins.bump { animation: bump .35s; }
@keyframes bump { 40% { transform: scale(1.25); } }
#stage { position: relative; flex: 1; overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#ctrls { position: absolute; top: 6px; left: 8px; right: 8px; display: none; gap: 8px; align-items: center; z-index: 10; pointer-events: none; }
#ctrls.on { display: flex; }
#ctrls button { pointer-events: auto; height: 42px; border: 0; border-radius: 14px; background: linear-gradient(rgba(84,66,150,.92), rgba(42,31,72,.88)); color: #fff;
  font-weight: 900; font-size: 15px; display: flex; align-items: center; gap: 6px; padding: 0 12px;
  box-shadow: inset 0 1.5px 0 rgba(255,255,255,.3), 0 3px 0 rgba(0,0,0,.35), 0 6px 12px rgba(15,6,40,.25); }
#ctrls button:active { transform: translateY(2px); }
#ctrls button:disabled { opacity: .4; }
#ctrls svg { width: 22px; height: 22px; }
#ctrls .sp { flex: 1; }
#bSpeed.fast { background: linear-gradient(#ffc46e, #ff9a2e 60%, #f2861a); color: var(--ink); }
#lvlStars { font-size: 16px; letter-spacing: 1px; color: var(--yellow); text-shadow: 0 2px 0 var(--ink); }
#hint { position: absolute; left: 14px; right: 14px; top: 64px; z-index: 12; pointer-events: none; background: rgba(255,255,255,.96); color: var(--ink);
  border-radius: 16px; padding: 12px 14px; font-weight: 800; font-size: 16px; line-height: 1.3; background: linear-gradient(#ffffff, #fff4e6);
  box-shadow: inset 0 -2px 0 rgba(0,0,0,.06), 0 6px 0 rgba(0,0,0,.22), 0 10px 22px rgba(20,8,50,.3);
  opacity: 0; transform: translateY(-10px); transition: .3s; }
#hint.on { opacity: 1; transform: none; }
.screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; overflow: hidden; padding: 14px; z-index: 5; }
.screen.on { display: flex; }
.btn { --edge: #c99a00; min-height: 58px; border: 0; border-radius: 18px; font-weight: 900; font-size: 20px; color: var(--ink);
  background: linear-gradient(#ffe680, #ffd23f 52%, #ffbe1a);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.7), inset 0 -3px 0 rgba(0,0,0,.08), 0 6px 0 var(--edge), 0 11px 18px rgba(25,8,55,.35);
  padding: 0 22px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-shadow: 0 1px 0 rgba(255,255,255,.45); }
.btn:active { transform: translateY(4px); box-shadow: inset 0 2px 0 rgba(255,255,255,.6), 0 2px 0 var(--edge), 0 4px 8px rgba(25,8,55,.3); }
.btn.alt { --edge: #c94d86; background: linear-gradient(#ffaad3, #ff7eb9 52%, #ff63a8); }
.btn.blue { --edge: #1f8db0; background: linear-gradient(#86e3ff, #3cc8f4 52%, #1fb2e3); }
.btn.danger { --edge: #a3162a; color: #fff; background: linear-gradient(#ff8a96, #ff4d5e 52%, #e0283d); }
.dangerzone { margin-top: 14px; padding-top: 12px; border-top: 2px dashed rgba(224,40,61,.35); text-align: center; }
.dangerzone small { display: block; margin-top: 6px; font-size: 12px; opacity: .7; }
.btn.green { --edge: #1f9c57; background: linear-gradient(#86f0b6, #3ddc84 52%, #24c46e); }
.btn.small { min-height: 48px; font-size: 17px; }
/* home */
#home { justify-content: center; gap: 14px; }
.logo { font-size: 52px; font-weight: 1000; line-height: .95; text-align: center; color: var(--yellow); letter-spacing: 1px;
  text-shadow: 0 4px 0 #ff7eb9, 0 8px 0 var(--ink), 3px 3px 0 var(--ink), -3px 3px 0 var(--ink), 3px -3px 0 var(--ink), -3px -3px 0 var(--ink);
  transform: rotate(-4deg); margin-bottom: 4px; animation: wob 2.4s ease-in-out infinite; }
@keyframes wob { 50% { transform: rotate(-1deg) scale(1.03); } }
.sub { font-weight: 800; font-size: 16px; opacity: .9; text-align: center; margin-bottom: 14px; text-shadow: 0 2px 0 var(--ink); }
#home .btn { width: min(320px, 86vw); }
.tipline { font-size: 13px; opacity: .8; text-align: center; max-width: 320px; }
/* level select */
.scroll { width: 100%; max-width: 440px; flex: 1; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; padding-bottom: 20px; }
.h { font-size: 24px; font-weight: 900; margin: 6px 0 12px; text-shadow: 0 3px 0 var(--ink); text-align: center; }
.daily { width: 100%; display: flex; align-items: center; gap: 12px; background: linear-gradient(135deg,#ffb04e,#ff8a8a 55%,#ff6fb0); border-radius: 20px; padding: 12px 14px; color: var(--ink);
  border: 0; box-shadow: inset 0 2px 0 rgba(255,255,255,.55), 0 6px 0 #b84a7c, 0 11px 18px rgba(25,8,55,.3); margin-bottom: 16px; text-align: left; }
.daily:active { transform: translateY(3px); }
.daily b { font-size: 20px; display: block; }
.daily span { font-weight: 700; font-size: 14px; }
.daily .ico { font-size: 34px; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 10px; padding-top: 6px; }
#albumInner .grid { grid-template-columns: repeat(3, 1fr); gap: 12px; }
.tile { aspect-ratio: 1 / 1.12; border: 0; border-radius: 18px; background: linear-gradient(#7363cf, #574aa6 50%, #4b3f98); color: #fff;
  box-shadow: inset 0 1.5px 0 rgba(255,255,255,.3), 0 6px 0 #231c4c, 0 10px 14px rgba(15,6,40,.25);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px; position: relative; }
.tile:active { transform: translateY(3px); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.3), 0 3px 0 #231c4c; }
.tile .n { font-size: 26px; font-weight: 1000; text-shadow: 0 3px 0 var(--ink); }
.tile .nm { font-size: 11px; font-weight: 800; opacity: .95; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .st { font-size: 13px; color: var(--yellow); letter-spacing: 1px; text-shadow: 0 2px 0 var(--ink); }
.tile img { width: 62%; image-rendering: pixelated; border-radius: 8px; border: 3px solid var(--ink); }
.tile.locked { background: linear-gradient(#463c84, #3a3170); opacity: .75; }
.tile.next { background: linear-gradient(#ffbc66, #ff9a2e 55%, #f4851a); color: var(--ink); animation: pulse 1.2s infinite; }
.tile.next .n { text-shadow: none; }
.tile.hard { background: linear-gradient(160deg, #ffa060, #ff8a3d 30%, #d9435a); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.4), 0 6px 0 #7d1f35, 0 10px 14px rgba(15,6,40,.25); }
.tile.vhard { background: linear-gradient(160deg, #7a3caf, #5b2a86 30%, #2b1240); box-shadow: 0 6px 0 #12081d, 0 0 0 2px #ff4d5e inset, 0 10px 14px rgba(15,6,40,.3); }
.tile.locked.hard, .tile.locked.vhard { opacity: .8; }
.tile.next.hard, .tile.next.vhard { color: #fff; }
.tile .tbadge { position: absolute; top: -7px; left: 50%; transform: translateX(-50%); white-space: nowrap; }
.tile.hard .n, .tile.vhard .n { margin-top: 6px; }
.tile .n { margin-top: 6px; }
/* tier badges */
.tbadge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px 3px 5px; border-radius: 999px; font-weight: 900; font-size: 14px;
  color: #fff; border: 2px solid var(--ink); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.45), 0 2px 0 var(--ink); line-height: 1; vertical-align: middle; white-space: nowrap; }
.tbadge .ti { width: 20px; height: 20px; flex: none; }
.tbadge { background: linear-gradient(color-mix(in srgb, var(--tc, #888) 70%, #fff), var(--tc, #888) 60%); color: var(--tk, #fff); text-shadow: 0 1px 0 rgba(0,0,0,.25); }
.tbadge.hard { background: linear-gradient(#ff9a2e, #ff4d5e); }
.tbadge.vhard { background: linear-gradient(#ff6b6b, #c81e3a); }
.tbadge.uhard { background: linear-gradient(#ff6fb8, #b0186a); }
.tbadge.yhard { background: linear-gradient(#b07cff, #5a22b0); }
.tbadge.zhard { background: linear-gradient(#3a2f9a, #120c3a); color: #7ef9ff; }
.tbadge.super { background: linear-gradient(#fff3a0, #ffc21a 45%, #e08a00); color: #5a2a00; text-shadow: 0 1px 0 rgba(255,255,255,.6); }
.tbadge .crown { width: auto; height: auto; font-size: 1.1em; line-height: 1; }
.tierkey { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px 4px; margin: -6px 0 8px; }
.tile .tbadge.soft { opacity: .95; }
.tile { --tc: transparent; }
.tile.tier-tile { box-shadow: inset 0 0 0 3px var(--tc), inset 0 1.5px 0 rgba(255,255,255,.4), 0 6px 0 #231c4c, 0 10px 14px rgba(15,6,40,.25); }
.tile.uhard { background: linear-gradient(160deg, #ff5fae, #c41e7a 35%, #6a0c40); box-shadow: 0 6px 0 #3a0624, 0 0 0 2px #ffd23f inset, 0 10px 14px rgba(15,6,40,.3); }
.tile.yhard { background: linear-gradient(160deg, #a16bff, #6a2fd0 35%, #2a0c6a); box-shadow: 0 6px 0 #160540, 0 0 0 2px #ff7eb9 inset, 0 10px 14px rgba(15,6,40,.3); }
.tile.zhard { background: linear-gradient(160deg, #2c2a7a, #14104a 40%, #05031a); box-shadow: 0 6px 0 #000, 0 0 0 2px #7ef9ff inset, 0 10px 14px rgba(15,6,40,.35); }
.tile.super { background: linear-gradient(160deg, #fff2a0, #ffc21a 35%, #d07a00); color: #5a2a00; box-shadow: 0 6px 0 #6a3a00, 0 0 0 3px #fff inset, 0 0 16px #ffd23f, 0 10px 14px rgba(15,6,40,.3); animation: superglow 1.4s ease-in-out infinite alternate; }
.tile.super .n, .tile.super .nm { color: #5a2a00; text-shadow: 0 2px 0 #fff6c8; }
@keyframes superglow { to { box-shadow: 0 6px 0 #6a3a00, 0 0 0 3px #fff inset, 0 0 28px #ffe066, 0 10px 14px rgba(15,6,40,.3); } }
.tile.locked.uhard, .tile.locked.yhard, .tile.locked.zhard, .tile.locked.super { opacity: .8; }
.tile.uhard .n, .tile.yhard .n, .tile.zhard .n, .tile.super .n { margin-top: 6px; }
.tile .skipped { position: absolute; bottom: 4px; right: 6px; font-size: 11px; }
.tbadge.sm { font-size: 10px; padding: 2px 6px 2px 3px; gap: 2px; }
.tbadge.sm .ti { width: 14px; height: 14px; }
.legend { text-align: center; font-weight: 800; font-size: 12px; margin: -4px 0 16px; opacity: .95; }
.sum .tb { color: #c2410c; }
#tierChip { pointer-events: none; display: none; }
#tierChip.on { display: inline-flex; }
/* hard / very hard: make room for the difficulty chip (undo shows icon only, compact stars) */
#ctrls.tiered { gap: 6px; }
#ctrls.tiered #undoN { display: none; }
#ctrls.tiered #lvlStars { font-size: 13px; letter-spacing: 0; }
#tierIntro { position: absolute; left: 50%; top: 38%; z-index: 14; pointer-events: none; transform: translate(-50%, -50%) scale(.5); opacity: 0;
  text-align: center; width: max-content; max-width: 94vw; transition: opacity .25s, transform .35s cubic-bezier(.3,1.7,.5,1); }
#tierIntro.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
#tierIntro .tbadge { font-size: 30px; padding: 8px 18px 8px 10px; border-width: 4px; box-shadow: 0 6px 0 var(--ink); gap: 8px; }
#tierIntro .tbadge .ti { width: 44px; height: 44px; }
#tierIntro .tsub { margin-top: 12px; font-weight: 900; font-size: 16px; color: #fff; text-shadow: 0 2px 0 var(--ink), 0 0 6px var(--ink); }
#tierIntro.x .tbadge { animation: throb .6s ease-in-out infinite alternate; }
@keyframes throb { to { transform: scale(1.06) rotate(-2deg); } }
@keyframes pulse { 50% { transform: scale(1.04); } }
/* album */
.card { border-radius: 18px; background: linear-gradient(#7363cf, #574aa6 50%, #4b3f98); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.3), 0 6px 0 #231c4c, 0 10px 14px rgba(15,6,40,.25);
  padding: 8px; text-align: center; border: 0; color: #fff; }
.card img { width: 100%; image-rendering: pixelated; border-radius: 10px; border: 3px solid var(--ink); display: block; }
.card b { display: block; font-size: 15px; margin-top: 4px; }
.card small { display: block; font-size: 11px; opacity: .85; font-weight: 700; min-height: 2.4em; }
.card.special { background: linear-gradient(160deg,#ffe680,#ffd23f 35%,#ff9a2e); color: var(--ink); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.6), 0 6px 0 #b86f00, 0 10px 14px rgba(15,6,40,.25); }
.card.lock { background: linear-gradient(#463c84, #3a3170); color: #cfc6f5; }
.card { position: relative; }
.card.family { background: linear-gradient(160deg,#ffb0d4,#ff8fc0 35%,#ff5f9a); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.55), 0 6px 0 #b8336b, 0 10px 16px rgba(120,20,70,.3); }
.card.family.lock { background: linear-gradient(160deg,#8a5a9c,#7a4a8c 35%,#5b3a7a); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.25), 0 6px 0 #2e1d48; color: #ffd9ea; }
.card.family img { border-color: #ffd23f; box-shadow: 0 0 0 3px #ff5f9a, 0 0 12px 2px rgba(255,210,63,.8); }
.card.family.lock img { border-color: #8a5aa0; box-shadow: none; }
.bigport.family { border-color: #ffd23f !important; box-shadow: 0 0 0 5px #ff5f9a, 0 0 22px 4px rgba(255,210,63,.85); }
.card .heart { position: absolute; top: 2px; right: 4px; font-style: normal; font-size: 18px; color: #ff2f6d; text-shadow: 0 2px 0 var(--ink); z-index: 1; }
/* modal */
#modal { position: absolute; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; background: rgba(20,12,40,.6); padding: 16px; }
#modal.on { display: flex; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
#modalCard { width: min(380px, 100%); max-height: 100%; overflow-y: auto; background: linear-gradient(#fffdf7, #fff4e2); color: var(--ink); border-radius: 26px; padding: 20px 18px; text-align: center;
  box-shadow: inset 0 2px 0 #fff, inset 0 -3px 0 rgba(120,80,30,.08), 0 10px 0 rgba(0,0,0,.28), 0 20px 40px rgba(15,5,40,.4); animation: pop .35s cubic-bezier(.3,1.6,.5,1); touch-action: pan-y; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }
#modalCard h2 { margin: 0 0 8px; font-size: 28px; font-weight: 1000; }
#modalCard p { font-weight: 700; font-size: 16px; line-height: 1.35; margin: 6px 0 12px; }
#modalCard .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
#modalCard .row .btn { flex: 1; min-width: 130px; }
.bigport { width: 60%; image-rendering: pixelated; border-radius: 16px; border: 5px solid var(--ink); animation: pop .5s cubic-bezier(.3,1.6,.5,1); }
.stars { font-size: 44px; letter-spacing: 4px; margin: 6px 0; }
.stars span { display: inline-block; color: #d7cfe6; transform: scale(.4); transition: .3s cubic-bezier(.3,1.8,.5,1); text-shadow: 0 3px 0 var(--ink); }
.stars span.on { color: var(--yellow); transform: scale(1); }
.sum { text-align: left; background: linear-gradient(#ece0cb, #f4ead9); box-shadow: inset 0 2px 4px rgba(90,60,20,.15); border-radius: 14px; padding: 10px 14px; font-weight: 800; font-size: 15px; }
.sum div { display: flex; justify-content: space-between; padding: 2px 0; }
.sum .tot { border-top: 2px dashed #cbb99a; margin-top: 4px; padding-top: 6px; font-size: 18px; }
.tipcv { width: 120px; height: 72px; image-rendering: pixelated; }
#toast { position: absolute; left: 50%; bottom: 24px; transform: translate(-50%, 30px); background: #fff; color: var(--ink); font-weight: 800; padding: 12px 16px;
  border-radius: 14px; z-index: 50; opacity: 0; transition: .3s; width: max-content; max-width: 90%; text-align: center; pointer-events: none; background: linear-gradient(#ffffff, #fff1e0);
  box-shadow: inset 0 -2px 0 rgba(0,0,0,.06), 0 5px 0 rgba(0,0,0,.22), 0 10px 20px rgba(20,8,50,.3); }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
/* 1.1: main-menu button, two-line in-level title, quit + goodbye screen, version label */
#title.two { font-size: 15px; line-height: 1.05; letter-spacing: 0; }
#title.two .sep { display: none; }
#title.two small { display: block; font-size: 12px; font-weight: 800; opacity: .85; overflow: hidden; text-overflow: ellipsis; }
#topbar .ib { width: 44px; height: 44px; }
#topbar { gap: 5px; }
.btn.quit { --edge: #1b1440; background: linear-gradient(#5e5096, #3f3478 55%, #352b68); color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.35); min-height: 46px; font-size: 16px; }
#home .btn.quit { width: min(200px, 60vw); margin-top: 2px; }
.ver { position: absolute; right: 12px; bottom: 8px; font-size: 11px; font-weight: 800; opacity: .45; letter-spacing: .5px; pointer-events: none; }
#bye { justify-content: center; gap: 10px; text-align: center; }
#bye h2 { margin: 6px 0 0; font-size: 30px; font-weight: 1000; color: var(--yellow); text-shadow: 0 3px 0 var(--ink), 2px 2px 0 var(--ink), -2px 2px 0 var(--ink); }
#bye p { margin: 0 0 10px; font-weight: 800; font-size: 17px; text-shadow: 0 2px 0 var(--ink); max-width: 300px; }
#bye .btn { width: min(280px, 80vw); }
.byedog { width: 150px; height: 150px; image-rendering: pixelated; border-radius: 22px; border: 5px solid #ffd23f; box-shadow: 0 0 0 5px #ff5f9a, 0 10px 24px rgba(15,5,40,.4); }
#bTilt { position: absolute; right: 8px; bottom: 8px; z-index: 11; display: none; align-items: center; gap: 5px; height: 36px; padding: 0 11px 0 8px; border: 0; border-radius: 18px;
  color: #fff; font-weight: 900; font-size: 13px; background: linear-gradient(rgba(84,66,150,.92), rgba(42,31,72,.88)); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.3), 0 3px 0 rgba(0,0,0,.35); }

  const key = dog.id + (locked ? 'L' : '') + (!locked && hasGear(dog.id) ? '+' + gearKey(dog.id) : '');
  if (PURL[key]) return PURL[key];
  const src = locked ? silhouette(dog) : hasGear(dog.id) ? dressedPortrait(dog) : portrait(dog), cv = document.createElement('canvas');
  cv.width = cv.height = 128; const c = cv.getContext('2d'); c.imageSmoothingEnabled = false; c.drawImage(src, 0, 0, 128, 128);
  if (locked) { c.fillStyle = '#fff'; c.font = '900 56px system-ui'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', 64, 70); }
  return (PURL[key] = cv.toDataURL());

function todayKey(d = new Date()) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

/* the daily generator runs a few quick simulations to hit its tier, so it is pre-built in idle time after boot

let dailyCache = null;
function getDaily() {
  const seed = todaySeed(), key = 'packleader.daily';   // (storage keys keep the old prefix on purpose)
  if (dailyCache && dailyCache.seed === seed) return dailyCache.def;
  try { const c = JSON.parse(localStorage.getItem(key)); if (c && c.seed === seed && c.v === 3 && c.def && c.def.grid) { dailyCache = c; return c.def; } } catch (e) {}
  dailyCache = { seed, v: 3, def: PL.genDaily(seed) };
  try { localStorage.setItem(key, JSON.stringify(dailyCache)); } catch (e) {}
  return dailyCache.def;
}

/* banks a won level (coins, stars, album) exactly once; used by the results screen and by the menu button in the
   finale / bonus round. 3.5: the coin breakdown comes from levelEarnings() (econ.js). A bonus-round prize was already
   granted when the wheel/reels stopped; it is only listed here. */
function bankLevel(fetchBonus, bones = 0, bonus = null) {
  const stars = G.undos === 0 ? 3 : G.undos <= 2 ? 2 : 1;
  const first = !G.daily && !save.firstClear[G.def.id];
  const E = levelEarnings(G, fetchBonus, bones, first);
  save.coins += E.total; G.banked = true;
  if (first) save.firstClear[G.def.id] = true;
  if (G.daily) save.dailyBonus[todayKey()] = true;
  if (G.superPrize) { E.lines.push({ k: 'superbars', label: `💰 Gullstangir ×${G.superPrize.bars}`, v: G.superPrize.coins, cls: 'prize' }); E.lines.push({ k: 'superbombs', label: `💣 Sprengjur í bakpokann: +${G.superPrize.bombs}`, v: 0, cls: 'prize' }); }
  if (bonus && bonus.got) E.lines.push({ k: 'bonus', label: (bonus.kind === 'wheel' ? '🎡 Lukkuhjól: ' : '🎰 Spilakassi: ') + bonus.got.text, v: bonus.got.coins, cls: 'prize' });
  let newDog = false, best = 0;
  if (G.daily) { const k = todayKey(); best = save.daily[k] = Math.max(save.daily[k] || 0, E.total); }
  else save.stars[G.def.id] = Math.max(save.stars[G.def.id] || 0, stars);
  if (!save.album.includes(G.dog.id)) { save.album.push(G.dog.id); newDog = true; }
  persist();
  return { stars, E, earned: E.lines.reduce((a, l) => a + l.v, 0), newDog, best, T: TIERS[G.def.tier] || {} };
}
function finishLevel(fetchBonus, bones = 0, bonus = null) {
  const { stars, E, earned, newDog, best, T } = bankLevel(fetchBonus, bones, bonus);
  const d = G.dog, wl = d.g === 'f' ? 'Velkomin' : 'Velkominn';
  const nextDef = !G.daily && PL.LEVELS.find(l => l.id === G.def.id + 1);

    ${newDog ? '<p>📖 Ný mynd í Hundaalbúminu!</p>' : ''}${G.daily ? `<p>Besta í dag: ${best} stig</p>` : ''}
    ${stars < 3 ? '<p style="font-size:13px;opacity:.75">3 stjörnur = klára án þess að afturkalla.</p>' : ''}
    <div class="row">${nextDef ? '<button class="btn" data-act="next">Áfram ▶</button>' : `<button class="btn" data-act="${G.daily ? 'home' : 'levels'}">Áfram ▶</button>`}

/* ===== 3.5 (+4.0 yard sizes, owner avatar): fair coin economy – earnings, Hundagarðurinn (yard), Búðin (shop), helpers, dog gear, bonus rounds =====
   Principles (from the user): clear goals the player picks; rewards for skill/exploration; visible, finishable
   progression; no nagging, no streak penalties, no timers, no loot boxes. NO real money anywhere – only "nammi"
   earned by playing. Bonus-round spins are only earned by clearing levels (never bought) and their odds are shown. */
const ECON = { firstClear: 100, dailyBonus: 100, bone: 20, eff: { 3: 60, 4: 30 }, noUndo: 60, fewUndo: 20 };

/* ---------- save fields + migration (called from loadSave; save key stays packleader.v2) ---------- */
function ensureEcon(d) {
  d.yard = Array.isArray(d.yard) ? d.yard : [];
  if (!d.yardSlots || typeof d.yardSlots !== 'object') {   // 4.0: 3.5 fixed-slot items move onto their new slot (nothing is lost)
    d.yardSlots = {};
    for (const id of d.yard) { const m = { sign: ['m1', 'sign'], fenceL: ['fenceL', 'picket'], fenceR: ['fenceR', 'picket'], fenceT: ['fenceT', 'picket'], ball: ['s1', 'ball'], frisbee: ['s2', 'frisbee'], water: ['s3', 'water'], food: ['s4', 'food'], flowers: ['m2', 'flowers'], tulips: ['m3', 'tulips'], rope: ['m4', 'rope'], bench: ['m5', 'bench'], hurdle: ['m6', 'hurdle'], houseR: ['m7', 'houseR'], houseB: ['m8', 'houseB'], tree: ['l1', 'tree'], sandbox: ['l2', 'sandbox'], tunnel: ['l3', 'tunnel'], pond: ['x1', 'pond'], fountain: ['x2', 'fountain'] }[id]; if (m) d.yardSlots[m[0]] = m[1]; }
    // (a literal copy of YARD_OLD because this runs before the econ.js constants exist)
  }
  d.skipped = d.skipped || {};
  d.owned = Array.isArray(d.owned) ? d.owned : [];
  d.gear = d.gear && typeof d.gear === 'object' ? d.gear : {};
  d.helpers = Object.assign({ undo: 0, slot: 0, peek: 0, bomb: 0 }, d.helpers || {});
  d.firstClear = d.firstClear || {};
  d.dailyBonus = d.dailyBonus || {};
  d.spins = d.spins || { wheel: 0, slot: 0 };
  if (!d.econ) {   // first run of 3.5: retro-grant the first-clear bonus for every level already cleared (once)
    let n = 0;
    for (const id in d.stars) if (d.stars[id] && !d.firstClear[id]) { d.firstClear[id] = true; n++; }
    // (100 = ECON.firstClear; a literal because this runs before the econ.js constants exist)
    d.retro = n * 100; d.coins = (d.coins || 0) + d.retro; d.econ = 1;
  }
  return d;
}

/* ---------- earnings: one breakdown used by the results screen (and tests) ---------- */
function levelEarnings(g, fetchBonus, bones, first) {
  const lines = [], add = (k, label, v, cls) => { if (v) lines.push({ k, label, v, cls: cls || '' }); };
  const T = TIERS[g.def.tier] || {};
  add('eat', 'Nammi étið', g.total);
  add('combo', 'Combo-bónus', g.comboBonus);
  if (first && !g.daily) add('first', 'Fyrsta skipti!', ECON.firstClear, 'gold');
  add('undo', g.undos === 0 ? 'Án afturköllunar' : 'Fáar afturkallanir', g.undos === 0 ? ECON.noUndo : g.undos <= 2 ? ECON.fewUndo : 0);
  add('eff', `Vel nýttir taumar (mest ${g.maxSlots})`, g.slot6 ? 0 : (ECON.eff[g.maxSlots] || (g.maxSlots <= 2 ? ECON.eff[3] : 0)));
  add('tier', `${T.name || ''}-bónus (+${Math.round((T.bonus || 0) * 100)}%)`, Math.round(g.total * (T.bonus || 0)), 'tb');
  add('bones', `Gullbein ×${bones}`, bones * ECON.bone);
  add('fetch', 'Sækja-bónus', fetchBonus);
  if (g.daily && !save.dailyBonus[todayKey()]) add('daily', 'Dagleg þraut leyst', ECON.dailyBonus, 'gold');
  return { lines, total: lines.reduce((a, l) => a + l.v, 0) };
}

  const ell = (cx, cy, rx, ry, col) => { for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (((x + 0.5 - cx) / rx) ** 2 + ((y + 0.5 - cy) / ry) ** 2 <= 1) set(x, y, col); };
  const tri = (ax, ay, bx, by, cx, cy, col) => { for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const px = x + 0.5, py = y + 0.5;
    const s1 = (bx - ax) * (py - ay) - (by - ay) * (px - ax), s2 = (cx - bx) * (py - by) - (cy - by) * (px - bx), s3 = (ax - cx) * (py - cy) - (ay - cy) * (px - cx);
    if ((s1 >= 0 && s2 >= 0 && s3 >= 0) || (s1 <= 0 && s2 <= 0 && s3 <= 0)) set(x, y, col); } };
  const b = GEAR.find(x => x.id === g.b), co = GEAR.find(x => x.id === g.c), h = GEAR.find(x => x.id === g.h);
  if (b) {

      const img = c.getImageData(0, 24, N, 8), d = img.data;
      for (let y = 0; y < 8; y++) for (let x = 0; x < N; x++) { const k = (y * N + x) * 4; if (!d[k + 3]) continue;
        const col = b.lux === 'rainbow' ? RB[y] : b.lux === 'aurora' ? AU[(y + ((x >> 2) & 1)) % 7] : ((x + y) % 5 === 0 ? '#fff6c0' : (y > 3 ? '#e8a810' : '#ffc21a'));
        d[k] = parseInt(col.slice(1, 3), 16); d[k + 1] = parseInt(col.slice(3, 5), 16); d[k + 2] = parseInt(col.slice(5, 7), 16); }
      c.putImageData(img, 0, 24);

      if (b.lux === 'gold') { ell(16, 27.6, 1.8, 1.8, '#e8262e'); set(15, 27, '#ff9aa4'); }   // ruby brooch
    }
    [[slim ? 11 : 8, 27], [slim ? 12 : 9, 28], [slim ? 21 : 23, 27], [slim ? 20 : 22, 28]].forEach(([x, y]) => set(x, y, b.dk));
    if (b.star) [[12, 26], [19, 26], [16, 29], [14, 27], [18, 28]].forEach(([x, y]) => set(x, y, '#ffffff'));
    if (b.flag) { rect(9, 26, 23, 26, '#ffffff'); rect(14, 24, 15, 31, '#ffffff'); rect(10, 26, 22, 26, '#e8262e'); rect(14, 25, 14, 30, '#e8262e'); }
  }
  if (co) { rect(9, 24, 22, 24, co.col); rect(10, 25, 21, 25, shade(co.col, -0.25)); if (co.tag) { ell(16, 26.6, 1.6, 1.6, '#ffd23f'); set(15, 26, '#fff6c0'); } }
  if (h) {

/* ---------- buying ---------- */
function canAfford(p) { return save.coins >= p; }
function buy(price, what) {
  if (!canAfford(price)) { Snd.deny(); toast(`Vantar ${price - save.coins} nammi – spilaðu fleiri borð!`, 2200); return false; }
  save.coins -= price; persist(); Snd.coin(); vibrate(20); if (what) toast(what, 1800); return true;
}
function buyYard(slotId, itemId) {
  if (itemId == null && typeof slotId === 'string' && slotId.includes(':')) [slotId, itemId] = slotId.split(':');
  const sl = ySlot(slotId), it = yItem(itemId);
  if (!sl || !it || save.yardSlots[slotId] || !fitsSlot(it, sl)) { if (sl && it && !fitsSlot(it, sl)) toast(`${it.name} passar ekki í ${YSIZE[sl.size].name.toLowerCase()}`, 1800); return false; }
  if (!buy(it.price, `Nýtt í garðinum: ${it.name}!`)) return false;
  save.yardSlots[slotId] = itemId; persist(); yardPop(placed(sl, itemId));
  if (yFilled() === YSLOTS.length && !save.yardDone) { save.yardDone = true; persist(); setTimeout(yardComplete, 900); }
  updateYardPanel(); return true;
}
function buyGear(id) {
  const it = GEAR.find(i => i.id === id); if (!it || save.owned.includes(id)) return false;
  if (!buy(it.price)) return false;
  save.owned.push(id); persist(); renderShop(); pickDogFor(id); return true;
}
function buyHelper(k) {
  const h = HELPERS[k]; if (!h) return false;
  if (!buy(h.price, `${h.name} ×${h.n} keypt`)) return false;
  save.helpers[k] += h.n; persist(); renderShop(); return true;
}
function equip(dogId, gid) {
  const it = GEAR.find(i => i.id === gid); if (!it) return;
  const g = Object.assign({}, gearOf(dogId)); g[it.t] = g[it.t] === gid ? '' : gid; save.gear[dogId] = g; persist();
}

    const xNow = row0 + (row1 - row0 + 1) * prog;

  if (G.chainT > 0) { G.chainT -= dt; if (G.chainT <= 0) { if (G.chain >= 15) floatText(W / 2, L.by + L.bh - 10, `Namm ×${G.chain}!`, '#ffd23f', 22); G.chain = 0; } }
