<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b2350">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Betri Hundar">
<title>Betri Hundar</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
/*STYLE*/
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <button class="ib" id="bBack" aria-label="Til baka"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="ib gone" id="bHome" aria-label="Aðalvalmynd"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11.5L12 4l8.5 7.5"/><path d="M6 10v9.5h4.2v-5.5h3.6v5.5H18V10"/></svg></button>
    <div id="title">Betri Hundar</div>
    <div id="coins" aria-label="Nammi"><svg viewBox="0 0 24 24"><path d="M6 9a2.5 2.5 0 1 1 3-3l6 6a2.5 2.5 0 1 1 3 3 2.5 2.5 0 1 1-3 3l-6-6a2.5 2.5 0 1 1-3-3z" fill="#fff3d6" stroke="#2a1f3d" stroke-width="1.6" transform="rotate(0 12 12)"/></svg><span id="coinN">0</span></div>
    <button class="ib" id="bMute" aria-label="Hljóð"></button>
    <button class="ib" id="bFS" aria-label="Fullur skjár"></button>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="ctrls">
      <button id="bUndo" aria-label="Afturkalla"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span id="undoN">Afturkalla</span></button>
      <span class="sp"></span><span id="tierChip"></span><span id="lvlStars">★★★</span><span class="sp"></span>
      <button id="bRestart" aria-label="Byrja aftur"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
      <button id="bSpeed" aria-label="Hraði">1×</button>
    </div>
    <button id="bTilt" aria-label="Hallastýring"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><rect x="8" y="3.5" width="8" height="15" rx="1.8" transform="rotate(-18 12 11)"/><path d="M3.5 17.5a9 9 0 0 0 5 3.2M20.5 17.5a9 9 0 0 1-5 3.2" stroke-linecap="round"/></svg><span>Halla: Á</span></button>
    <div id="hint"></div>
    <div id="tierIntro"></div>
    <section id="home" class="screen">
      <div class="logo">Betri<br>Hundar</div>
      <div class="sub">Sendu hundana út – bjargaðu hvuttunum!</div>
      <button class="btn" id="hPlay">▶ Spila</button>
      <button class="btn blue" id="hLevels">Borðaval</button>
      <button class="btn alt" id="hDaily">☀ Dagleg þraut</button>
      <button class="btn green" id="hAlbum">📖 Hundaalbúm</button>
      <button class="btn quit small" id="hQuit">⏻ Hætta leik</button>
      <div class="tipline" id="hTip"></div>
      <div class="ver" id="hVer">v1.1</div>
    </section>
    <section id="bye" class="screen">
      <img class="byedog" id="byeDog" alt="">
      <h2>Takk fyrir að spila!</h2>
      <p>Þú getur lokað glugganum núna.</p>
      <button class="btn" id="byeAgain">▶ Spila aftur</button>
    </section>
    <section id="levels" class="screen"><div class="scroll" id="levelsInner"></div></section>
    <section id="album" class="screen"><div class="scroll" id="albumInner"></div></section>
    <div id="modal"><div id="modalCard"></div></div>
    <div id="toast"></div>
  </div>
</div>
<script id="logic">
/*LOGIC*/
</script>
<script>
/*GAME*/
</script>
</body>
</html>
