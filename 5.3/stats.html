<!doctype html>
<html lang="is"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Betri Hundar – leikmenn og stigatafla</title>
<style>
body { margin: 0; font: 15px system-ui, Roboto, sans-serif; background: linear-gradient(#3a2690, #6a43c4 40%, #c064bc); color: #fff; min-height: 100vh; }
main { max-width: 980px; margin: 0 auto; padding: 16px 10px 40px; }
h1 { margin: 6px 0 2px; font-size: 26px; text-shadow: 0 2px 0 #2a1f3d; } p { margin: 4px 0 12px; opacity: .9; }
h2 { margin: 4px 0 8px; font-size: 18px; }
.wrap { overflow-x: auto; background: rgba(255,248,230,.97); color: #2a1f3d; border-radius: 16px; box-shadow: 0 6px 0 rgba(0,0,0,.25); }
table { border-collapse: collapse; width: 100%; font-size: 14px; } th, td { padding: 8px 9px; text-align: right; white-space: nowrap; border-bottom: 1px solid #ead9b8; }
th { background: #ffd23f; position: sticky; top: 0; cursor: pointer; } th:first-child, td:first-child { text-align: left; } td.n { text-align: left; font-weight: 800; }
td.l, th.l { text-align: left; }
.msg { background: rgba(255,248,230,.97); color: #2a1f3d; border-radius: 16px; padding: 14px; } a { color: #ffd23f; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 12px; }
.tabs button { font: 800 14px system-ui, sans-serif; padding: 9px 14px; border-radius: 14px; border: 3px solid #2a1f3d; background: #fff8e6; color: #2a1f3d; cursor: pointer; box-shadow: 0 3px 0 #2a1f3d; }
.tabs button.on { background: #ffd23f; transform: translateY(2px); box-shadow: 0 1px 0 #2a1f3d; }
.lbs { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.lb { background: rgba(255,248,230,.97); color: #2a1f3d; border-radius: 16px; padding: 10px 12px 12px; box-shadow: 0 6px 0 rgba(0,0,0,.25); }
.lb ol { margin: 0; padding: 0; list-style: none; } .lb li { display: flex; gap: 8px; align-items: baseline; padding: 5px 2px; border-bottom: 1px solid #ead9b8; }
.lb li b { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .lb li i { font-style: normal; font-weight: 800; color: #6a43c4; white-space: nowrap; }
.lb .rk { width: 26px; text-align: center; font-weight: 900; } .sub { font-size: 12px; opacity: .75; }
.chip { display: inline-block; padding: 1px 6px; border-radius: 8px; background: #efe3ff; margin: 0 2px; font-size: 12px; }
select { font: 700 14px system-ui; padding: 6px; border-radius: 10px; }
</style></head><body><main>
<h1>🐾 Betri Hundar – leikmenn og stigatafla</h1>
<p>Framvinda leikmanna sem völdu nafn í leiknum (útgáfa 4.3 og nýrri). Nýjustu tölurnar (fasar, gull- og eðalsteinahundar, vikuáskorun) koma frá útgáfu 5.3.</p>
<div class="tabs" id="tabs"><button data-t="lb">🏅 Stigatafla</button><button data-t="wk">🏆 Vikuáskorun</button><button data-t="all">📋 Allir leikmenn</button></div>
<div id="out" class="msg">Hleð…</div>
<p><a href="../5.3/">← Aftur í leikinn (5.3)</a> · <a href="./">útgáfan í þessari möppu</a></p>
</main>
<script>
const PH = [['Borð', '🐶', 'Venjulegir'], ['Gullborð', '✨', 'Gull'], ['Platínuborð', '🤍', 'Platínu'], ['Safírborð', '🔷', 'Safír'], ['Smaragðsborð', '💚', 'Smaragðs'], ['Rúbínborð', '❤️', 'Rúbín'], ['Demantsborð', '💎', 'Demants'], ['Svartdemantsborð', '🖤', 'Svartdemants'], ['Norðurljósasteinsborð', '🌌', 'Norðurljósa'], ['Stjörnusteinsborð', '⭐', 'Stjörnu']];
const ok = c => c && c.provider === 'supabase' && /^https:\/\//.test(c.url || '') && c.anonKey && !/YOUR|DIN|PLACEHOLDER|<|xxx/i.test(c.url + c.anonKey);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const MON = ['jan.', 'feb.', 'mar.', 'apr.', 'maí', 'jún.', 'júl.', 'ágú.', 'sep.', 'okt.', 'nóv.', 'des.'], p2 = n => String(n).padStart(2, '0');
const when = s => { if (!s) return ''; const d = new Date(s); if (isNaN(d)) return ''; return d.getDate() + '. ' + MON[d.getMonth()] + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()); };
function weekKeyOf(d) { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())), day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y = t.getUTCFullYear(), w = Math.ceil(((t - Date.UTC(y, 0, 1)) / 864e5 + 1) / 7); return y + '-V' + String(w).padStart(2, '0'); }
const fmtT = s => { s = s | 0; return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const num = v => Number.isFinite(+v) ? +v : 0;
/* one derived view per row: 5.3 rows carry yard.p53 (phase, board, wins + dogs per phase, stars); older rows are derived
   from the old columns (board_reached / boards_won / stars / dogs) + yard.gd / yard.md (5.0–5.2 gold and material dogs) */
function view(x) {
  const y = x.yard && typeof x.yard === 'object' ? x.yard : {}, p = y.p53 && typeof y.p53 === 'object' ? y.p53 : null;
  let cp, b, dogs, st, won;
  if (p && Array.isArray(p.dogs)) {
    cp = Math.max(-1, Math.min(8, p.cp | 0)); b = Math.max(1, Math.min(100, p.b | 0)); dogs = p.dogs.slice(0, 10).map(num); st = num(p.st); won = (p.won || []).slice(0, 10).map(num);
  } else {
    dogs = [num(x.dogs)]; const gd = Array.isArray(y.gd) ? y.gd.length : 0; dogs.push(gd); for (let m = 1; m <= 8; m++) dogs.push(y.md ? Object.values(y.md).filter(v => v === m).length : 0);
    cp = -1; b = Math.max(1, Math.min(100, num(x.board_reached) || 1)); if (num(x.boards_won) >= 100) b = 100; st = num(x.stars); won = [num(x.boards_won)];
  }
  const tot = dogs.reduce((a, v) => a + v, 0), done = cp >= 0 && (won[cp + 1] | 0) >= 100;
  const label = (cp < 0 && num(x.boards_won) >= 100 && !p) ? 'Borð 100 / 100' : `${PH[cp + 1][0]} ${b} / 100`;
  const score = (cp + 1) * 1000 + (done ? 100 : b) * 10 + (won[cp + 1] | 0) / 100;
  const wk = y.wk && typeof y.wk === 'object' && /^\d{4}-V\d\d$/.test(y.wk.w || '') ? y.wk : null;
  return { name: x.name || 'Leikmaður', label, score, cp, b, dogs, tot, st, wk, last: x.last_played, version: x.version, x };
}
let rows = [], V = [], tab = (location.hash || '#lb').slice(1), key = 'last', dir = -1, wsel = weekKeyOf(new Date());
function lb(title, sub, list, fmt) {
  return `<div class="lb"><h2>${title}</h2><div class="sub">${sub}</div><ol>${list.map((v, i) => `<li><span class="rk">${i < 3 ? ['🥇', '🥈', '🥉'][i] : i + 1}</span><b>${esc(v.name)}</b><i>${fmt(v)}</i></li>`).join('') || '<li>Enginn ennþá.</li>'}</ol></div>`;
}
const topN = (f) => V.slice().sort(f).slice(0, 20);
const dogChips = v => v.dogs.map((n, i) => n ? `<span class="chip" title="${PH[i][2]}">${PH[i][1]} ${n}</span>` : '').join('');
function renderLB() {
  return `<div class="lbs">${lb('🚀 Lengst komin', 'fasi og borð', topN((a, b) => b.score - a.score), v => esc(v.label))}
    ${lb('🐶 Flestir hundar', 'venjulegir + gull- og eðalsteinahundar', topN((a, b) => b.tot - a.tot), v => v.tot + ' 🐶')}
    ${lb('⭐ Flestar stjörnur', 'öll borð í öllum fösum', topN((a, b) => b.st - a.st), v => v.st + ' ★')}</div>`;
}
function renderWK() {
  const weeks = [...new Set([wsel, ...V.filter(v => v.wk).map(v => v.wk.w)])].sort().reverse();
  const r = V.filter(v => v.wk && v.wk.w === wsel).sort((a, b) => (b.wk.won | 0) - (a.wk.won | 0) || (b.wk.st | 0) - (a.wk.st | 0) || (a.wk.mv | 0) - (b.wk.mv | 0) || (a.wk.t | 0) - (b.wk.t | 0));
  return `<div class="lb"><h2>🏆 Vikuáskorun · <select id="wsel">${weeks.map(w => `<option value="${w}"${w === wsel ? ' selected' : ''}>Vika ${+w.split('-V')[1]} (${w.slice(0, 4)})</option>`).join('')}</select></h2>
    <div class="sub">Sama borðið hjá öllum alla vikuna (mánudagur–sunnudagur). Röðun: leyst, flestar ★, fæst pikk, stystur tími.</div>
    <ol>${r.map((v, i) => `<li><span class="rk">${v.wk.won ? (i < 3 ? ['🥇', '🥈', '🥉'][i] : i + 1) : '–'}</span><b>${esc(v.name)}</b><i>${v.wk.won ? `${'★'.repeat(v.wk.st | 0)} · ${v.wk.mv | 0} pikk · ${fmtT(v.wk.t)}` : 'ekki leyst ennþá'} <span class="sub">(${v.wk.n | 0} tilr.)</span></i></li>`).join('') || '<li>Enginn hefur reynt þessa viku ennþá.</li>'}</ol></div>`;
}
const COLS = [['name', 'Nafn'], ['label', 'Fasi / borð'], ['boards_won', 'Unnin borð'], ['tot', 'Hundar'], ['dogsby', 'Hundar eftir fasa'], ['st', '★'], ['wins', 'Sigrar'], ['losses', 'Töp'], ['daily_played', 'Daglegar'], ['daily_won', 'Daglegar unnar'], ['last', 'Síðast'], ['version', 'Útg.']];
const val = (v, k) => k === 'label' ? v.score : k === 'dogsby' ? v.tot : k in v ? v[k] : v.x[k];
function renderAll() {
  const r = V.slice().sort((a, b) => { const p = val(a, key), q = val(b, key); return (p > q ? 1 : p < q ? -1 : 0) * dir; });
  return `<div class="wrap"><table><thead><tr>${COLS.map(([k, t]) => `<th data-k="${k}" class="${k === 'dogsby' ? 'l' : ''}">${t}${k === key ? (dir < 0 ? ' ▼' : ' ▲') : ''}</th>`).join('')}</tr></thead><tbody>${r.map(v => `<tr>${COLS.map(([k]) =>
    k === 'name' ? `<td class="n">${esc(v.name)}</td>` : k === 'last' ? `<td>${when(v.last)}</td>` : k === 'dogsby' ? `<td class="l">${dogChips(v)}</td>` : `<td>${esc(k in v ? v[k] : v.x[k])}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${COLS.length}">Enginn leikmaður ennþá.</td></tr>`}</tbody></table></div>`;
}
function render() {
  if (!['lb', 'wk', 'all'].includes(tab)) tab = 'lb';
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  const o = document.getElementById('out'); o.className = tab === 'all' ? '' : ''; o.innerHTML = tab === 'lb' ? renderLB() : tab === 'wk' ? renderWK() : renderAll();
  document.querySelectorAll('th[data-k]').forEach(th => th.onclick = () => { const k = th.dataset.k; dir = k === key ? -dir : -1; key = k; render(); });
  const ws = document.getElementById('wsel'); if (ws) ws.onchange = () => { wsel = ws.value; render(); };
}
document.getElementById('tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; tab = b.dataset.t; history.replaceState(null, '', '#' + tab); if (rows.length || V.length) render(); };
function load(data) { rows = Array.isArray(data) ? data : []; V = rows.map(view); render(); }
window.__statsLoad = load;   // tests / screenshots feed sample rows
fetch('stats-config.json', { cache: 'no-store' }).then(r => r.json()).then(c => {
  if (!ok(c)) { document.getElementById('out').innerHTML = 'Tölfræðiþjónninn er ekki tengdur ennþá (stats-config.json vantar Supabase slóð og lykil).'; return; }
  return fetch(c.url.replace(/\/$/, '') + '/rest/v1/' + (c.table || 'players') + '?select=*&order=last_played.desc&limit=1000', { headers: { apikey: c.anonKey, Authorization: 'Bearer ' + c.anonKey } })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }).then(load);
}).catch(e => { if (!V.length) document.getElementById('out').innerHTML = 'Gat ekki sótt tölfræðina (' + esc(e.message) + ').'; });
</script></body></html>
